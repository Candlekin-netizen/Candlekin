padding-top:16px}.check-item{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#94a4b2}.check-item strong{font-weight:600}.check-item.done strong{color:var(--good)}.check-item.todo strong{color:var(--warn)}

<body>
<header class="header"><div class="header-inner"><div class="brand"><span class="flame"></span><span>CANDLEKIN</span></div><nav class="nav" id="mainNav"></nav><span class="preview-pill">PROTOTYPE PREVIEW</span><div class="status-pill" id="topStatus"></div><button class="btn" id="headerCta" type="button"></button></div></header>
<main id="app"></main>
<footer class="footer"><div class="wrap footer-inner"><div><strong>CANDLEKIN</strong> — Apply → GTD / FCFS → Public → Sealed → Reveal → Decode.</div><div>Preview build. Mint execution will happen on OpenSea.</div></div></footer>
<div class="phasebox" id="phaseBox"><div class="phasehead" id="phaseToggle"><strong class="mono" style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)">Lifecycle // internal</strong><span>▾</span></div><div class="phasebody" id="phaseBody"><select id="phaseSelect" aria-label="Internal lifecycle phase"><option value="WHITELIST_OPEN">WHITELIST_OPEN</option><option value="WHITELIST_CLOSED">WHITELIST_CLOSED</option><option value="CHECKER_OPEN">CHECKER_OPEN</option><option value="GTD_MINT">GTD_MINT</option><option value="FCFS_MINT">FCFS_MINT</option><option value="PUBLIC_MINT">PUBLIC_MINT</option><option value="SOLD_OUT">SOLD_OUT</option><option value="REVEALED">REVEALED</option><option value="CURATION_ADMIN">CURATION_ADMIN</option></select><div class="phasehelp" id="phaseHelp"></div></div></div>
<script>
const HERO_IMG='https://res.cloudinary.com/lqk65ybn/image/upload/v1788090258/ChatGPT_Image_Aug_24_2026_11_44_38_AM.png';
const SHARE_CARD_IMG='https://res.cloudinary.com/lqk65ybn/image/upload/v1788520552/sharecard.png';
const params=new URLSearchParams(location.search);
const internalMode=true;
const validPhases=['WHITELIST_OPEN','WHITELIST_CLOSED','CHECKER_OPEN','GTD_MINT','FCFS_MINT','PUBLIC_MINT','SOLD_OUT','REVEALED','CURATION_ADMIN'];
const requestedPhase=params.get('phase');
const initialPhase=validPhases.includes(requestedPhase)?requestedPhase:'WHITELIST_OPEN';
const phases={
 WHITELIST_OPEN:{status:'Whitelist applications open',cta:'Open whitelist',help:'Apply and generate a Genesis Signal. Final whitelist tier is GTD or FCFS.'},
 WHITELIST_CLOSED:{status:'Whitelist review in progress',cta:'View status',help:'Applications are closed. GTD and FCFS allowlists are being curated.'},
 CHECKER_OPEN:{status:'Allocation checker open',cta:'Check allocation',help:'Checker returns GTD, FCFS, or Public-only.'},
 GTD_MINT:{status:'GTD presale live',cta:'Open mint',help:'GTD presale stage on OpenSea.'},
 FCFS_MINT:{status:'FCFS presale live',cta:'Open mint',help:'FCFS allowlist presale stage on OpenSea.'},
 PUBLIC_MINT:{status:'Public mint live',cta:'Open mint',help:'Public stage on OpenSea. No whitelist required.'},
 SOLD_OUT:{status:'Sold out // pre-reveal',cta:'View collection',help:'Mint is complete. Owned Candlekin remain sealed until Reveal.'},
 REVEALED:{status:'Reveal live',cta:'Open Market Lab',help:'Final art, traits and Market Genome are visible.'},
 CURATION_ADMIN:{status:'Internal curation preview',cta:'Admin',help:'Internal review mock. GTD and FCFS are mutually exclusive.'}
};
const demoOwned={1842:{family:'Bearkin',bits:'1010 0110 1101'},2291:{family:'Bullkin',bits:'0011 1100 1001'},3807:{family:'Bearkin',bits:'1110 1001 0100'}};
const state={phase:initialPhase,page:'home',answers:Array(6).fill(null),q:0,walletConnected:false,owned:[1842,2291,3807],labId:1842,form:{x:'',wallet:'',sharedUrl:''},applicationSubmitted:false,copyStatus:'',shareStatus:'',applicants:[{id:'CK-01801',x:'@pixelmarc',wallet:'0xbbb...12df',signal:'0000 0000 0000',decision:''},{id:'CK-01802',x:'@chainlena',wallet:'0xccc...7ad1',signal:'0001 0011 1101',decision:''},{id:'CK-01803',x:'@bulltape',wallet:'0xddd...8be1',signal:'0010 0111 1010',decision:'GTD'},{id:'CK-01804',x:'@0xsignal',wallet:'0xeee...e011',signal:'0011 1011 0111',decision:'FCFS'},{id:'CK-01805',x:'@candleframe',wallet:'0xfff...aac1',signal:'0100 0110 1001',decision:''}]};
const qs=[['When the market accelerates, what do you trust first?',['Momentum','Structure','Volume','Confirmation']],['A signal appears before the crowd reacts. What is your instinct?',['Observe','Enter Early','Wait For Confirmation','Ignore The Noise']],['Which market state feels most natural to read?',['Trending','Volatile','Compressed','Reversing']],['When two signals conflict, what matters most?',['Patience','Conviction','Risk Control','Adaptability']],['Which type of move catches your attention first?',['Breakout','Reversal','Acceleration','Range Expansion']],['What defines a strong market signal to you?',['Timing','Clarity','Persistence','Alignment']]];
const checkerDB={'0x1111111111111111111111111111111111111111':'GTD','0x2222222222222222222222222222222222222222':'FCFS'};
function safeSignal(){const raw=state.answers.map(a=>a===null?'00':['00','01','10','11'][a]).join('');return raw.replace(/^(.{4})(.{4})(.{4})$/,'$1 $2 $3')}
function shareCaption(){return `Signal registered.\n\n${safeSignal()}\n\n@Candlekin // Genesis`}
function validX(){return /^@?[A-Za-z0-9_]{1,32}$/.test(state.form.x.trim())}
function validWallet(){return /^0x[a-fA-F0-9]{40}$/.test(state.form.wallet.trim())}
function allAnswered(){return state.answers.every(a=>a!==null)}
function shareGenerated(){return state.q>=6&&allAnswered()}
function validSharedPost(){try{const u=new URL(state.form.sharedUrl.trim());const h=u.hostname.toLowerCase().replace(/^www\./,'');return (h==='x.com'||h==='twitter.com')&&/^\/[^/]+\/status\/\d+/.test(u.pathname)}catch{return false}}
function canGenerateShare(){return validX()&&validWallet()&&allAnswered()}
function canSubmit(){return validX()&&validWallet()&&allAnswered()&&shareGenerated()&&validSharedPost()}
function sharePageUrl(){return new URL('genesis-share.html',location.href).href}
function parseGenome(bits){const clean=bits.replace(/ /g,''),m=parseInt(clean.slice(0,4),2),v=parseInt(clean.slice(4,8),2),c=parseInt(clean.slice(8),2);return{bits,m,v,c,mp:Math.round(m/15*100),vp:Math.round(v/15*100),cp:Math.round(c/15*100)}}
function demoGenomeFor(id){if(demoOwned[id])return parseGenome(demoOwned[id].bits);const n=((id*1493)+827)%4096;return parseGenome(n.toString(2).padStart(12,'0').replace(/(.{4})(.{4})(.{4})/,'$1 $2 $3'))}
function band(type,n){if(type==='m')return['DORMANT','BUILDING','ACTIVE','SURGING'][Math.min(3,Math.floor(n/4))];if(type==='v')return['STABLE','RESPONSIVE','VOLATILE','EXTREME'][Math.min(3,Math.floor(n/4))];return['FLEXIBLE','MEASURED','FIRM','ABSOLUTE'][Math.min(3,Math.floor(n/4))]}
function availablePages(){if(state.phase==='CURATION_ADMIN')return['admin'];if(state.phase==='WHITELIST_OPEN'||state.phase==='WHITELIST_CLOSED')return['home','whitelist','collection','faq'];if(state.phase==='CHECKER_OPEN')return['home','collection','faq'];if(['GTD_MINT','FCFS_MINT','PUBLIC_MINT'].includes(state.phase))return['home','mint','collection','faq'];if(state.phase==='SOLD_OUT')return['home','collection','faq'];if(state.phase==='REVEALED')return['home','collection','marketlab','faq'];return['home']}
function renderNav(){const labels={home:'Home',whitelist:'Whitelist',mint:'Mint',collection:'Collection',marketlab:'Market Lab',faq:'FAQ',admin:'Admin'};document.getElementById('mainNav').innerHTML=availablePages().map(p=>`<button type="button" class="${state.page===p?'active':''}" onclick="setPage('${p}')">${labels[p]}</button>`).join('')}
function heroArt(caption2){return `<div class="art-box"><img src="${HERO_IMG}" alt="Candlekin sealed identity artwork"><div class="caption"><span>Identity // sealed</span><span>${caption2}</span></div></div>`}
function collectionOverview(){return `<section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Collection</div><h2>4,096 market states.</h2></div><div class="subtle">A fixed 2,048 Bullkin / 2,048 Bearkin split. Visual DNA and Market Genome remain separate identity layers.</div></div><div class="grid-4"><div class="card stat"><div class="label">Supply</div><div class="value">4,096</div><p>Hard-pixel collection.</p></div><div class="card stat"><div class="label">Bullkin</div><div class="value">2,048</div><p>Fixed family allocation.</p></div><div class="card stat"><div class="label">Bearkin</div><div class="value">2,048</div><p>Fixed family allocation.</p></div><div class="card stat"><div class="label">Genome</div><div class="value">12-bit</div><p>One unique state per NFT after Reveal.</p></div></div></div></section>`}
function identitySection(){return `<section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Identity architecture</div><h2>Three systems. No hidden influence.</h2></div><div class="subtle">Participant identity, visual appearance and post-Reveal market identity remain separate.</div></div><div class="grid-3"><div class="card"><div class="eyebrow">Visual DNA</div><h3>Appearance</h3><p>Background, Head, Body, Body Accessory, Glasses and Special Trait define how a Candlekin looks.</p></div><div class="card highlight"><div class="eyebrow">Market Genome</div><h3>Permanent NFT identity</h3><p>A unique 12-bit market-state identity revealed after mint.</p></div><div class="card"><div class="eyebrow">Genesis Signal</div><h3>Participant identity</h3><p>Generated during whitelist calibration. It never determines GTD/FCFS tier or NFT outcome.</p></div></div></div></section>`}
function journeySection(){return `<section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Collector journey</div><h2>Apply → Mint → Sealed → Reveal → Decode.</h2></div></div><div class="journey"><div class="journey-step"><span>01</span><strong>Apply</strong><p>Register a Genesis Signal and enter review.</p></div><div class="journey-step"><span>02</span><strong>OpenSea</strong><p>GTD presale → FCFS presale → Public.</p></div><div class="journey-step"><span>03</span><strong>Sealed</strong><p>Ownership exists while final identity stays hidden.</p></div><div class="journey-step"><span>04</span><strong>Reveal</strong><p>Final art, traits and Market Genome become visible.</p></div><div class="journey-step"><span>05</span><strong>Decode</strong><p>Explore the genome in Market Lab.</p></div></div></div></section>`}
function faq(){return `<section><div class="wrap"><div class="section-head"><div><div class="eyebrow">FAQ</div><h2>What matters.</h2></div></div><div class="grid-2"><div class="card"><h3>What is Genesis Signal?</h3><p>A 12-bit participant identity created during whitelist calibration. It does not decide whitelist tier or NFT outcome.</p></div><div class="card"><h3>What is GTD?</h3><p>A guaranteed allowlist tier. Current direction remains one guaranteed free mint; exact count and window are still TBD.</p></div><div class="card"><h3>What is FCFS?</h3><p>An allowlisted presale tier with access before Public, but allocation is not guaranteed.</p></div><div class="card"><h3>What is Public?</h3><p>The final OpenSea mint stage. No whitelist is required. Wallet limit and final timing remain TBD.</p></div></div></div></section>`}
function home(){if(state.phase==='WHITELIST_OPEN')return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>Whitelist applications open</span><span class="chip">4,096 supply</span><span class="chip">Robinhood Chain</span></div><div class="eyebrow">Candlekin // whitelist season</div><h1>Register your signal.</h1><p class="lead">Apply, generate a Genesis Signal and enter review. Selected whitelist applicants receive either GTD or FCFS. Everyone else can join Public later.</p><div class="actions"><button class="btn" type="button" onclick="setPage('whitelist')">Open whitelist</button><button class="btn secondary" type="button" onclick="setPage('collection')">View collection</button></div></div>${heroArt('Whitelist campaign')}</div></section>${collectionOverview()}${identitySection()}${journeySection()}${faq()}`;if(state.phase==='WHITELIST_CLOSED')return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip">Whitelist closed</span><span class="chip">Review in progress</span></div><div class="eyebrow">Candlekin // curation</div><h1>Applications are under review.</h1><p class="lead">The applicant pool is locked. Candlekin is preparing mutually exclusive GTD and FCFS allowlists before the checker opens.</p></div>${heroArt('Applications locked')}</div></section>${collectionOverview()}${journeySection()}${faq()}`;if(state.phase==='CHECKER_OPEN')return checkerHome();if(state.phase==='GTD_MINT')return mintEraHome('GTD presale is live.','Eligible GTD wallets can claim their guaranteed allocation through OpenSea.');if(state.phase==='FCFS_MINT')return mintEraHome('FCFS presale is live.','Eligible FCFS wallets can mint from remaining presale supply on a first-come, first-served basis.');if(state.phase==='PUBLIC_MINT')return mintEraHome('Public mint is live.','Public is open on OpenSea. No whitelist is required.');if(state.phase==='SOLD_OUT')return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip">Sold out</span><span class="chip">Pre-reveal</span></div><div class="eyebrow">Candlekin // sealed</div><h1>4,096 / 4,096.</h1><p class="lead">Minting is complete. Every Candlekin remains sealed until Reveal.</p></div>${heroArt('Sold out // pre-reveal')}</div></section>${collectionOverview()}${journeySection()}${faq()}`;if(state.phase==='REVEALED')return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>Reveal live</span><span class="chip">Market Lab online</span></div><div class="eyebrow">Candlekin // revealed</div><h1>Every state is now visible.</h1><p class="lead">Final artwork, visual traits and Market Genome are now presented.</p><div class="actions"><button class="btn" type="button" onclick="setPage('marketlab')">Open Market Lab</button></div></div>${heroArt('Reveal complete')}</div></section>${collectionOverview()}${identitySection()}${journeySection()}${faq()}`;return adminPage()}
function checklistHtml(){const rows=[['X username',validX()],['EVM wallet',validWallet()],['6 calibration answers',allAnswered()],['Genesis share card',shareGenerated()],['Shared X post URL',validSharedPost()]];return `<div class="checklist"><div class="tiny">Application checklist</div>${rows.map(([n,ok])=>`<div class="check-item ${ok?'done':'todo'}"><span>${n}</span><strong>${ok?'READY':'REQUIRED'}</strong></div>`).join('')}</div>`}
function whitelistPage(){if(state.phase==='WHITELIST_CLOSED')return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip">Whitelist closed</span><span class="chip">Under review</span></div><div class="eyebrow">Candlekin // whitelist</div><h1>Applications are closed.</h1><p class="lead">Submissions are being reviewed. Checker results will be GTD, FCFS or Public-only.</p></div>${heroArt('Whitelist closed')}</div></section>`;const q=qs[Math.min(state.q,5)],showShare=shareGenerated();return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>Whitelist applications open</span><span class="chip">Genesis calibration</span></div><div class="eyebrow">Candlekin // whitelist</div><h1>Register your signal.</h1><p class="lead">Complete every required field. Incomplete applications cannot be submitted.</p></div>${heroArt('Whitelist application')}</div></section><section id="apply"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Application</div><h2>Whitelist entry.</h2></div><div class="subtle">Preview validation is strict: X, wallet, all six answers and the shared X post URL are required.</div></div><div class="status-grid"><div class="card"><div class="form-grid"><div><label for="xUser">X username</label><input id="xUser" value="${escapeHtml(state.form.x)}" oninput="updateField('x',this.value)" placeholder="@username"><div id="xHelp" class="field-help">Required.</div></div><div><label for="wallet">EVM wallet</label><input id="wallet" value="${escapeHtml(state.form.wallet)}" oninput="updateField('wallet',this.value)" placeholder="0x..."><div id="walletHelp" class="field-help">Must be a valid 0x address.</div></div></div><div class="question"><label>Calibration question ${Math.min(state.q+1,6)} / 6</label><h3>${q[0]}</h3><div class="options">${q[1].map((o,i)=>`<button type="button" class="option ${state.answers[Math.min(state.q,5)]===i?'active':''}" onclick="pickAnswer(${Math.min(state.q,5)},${i})">${o}</button>`).join('')}</div></div><div class="actions"><button class="btn secondary" type="button" ${state.q===0?'disabled':''} onclick="prevQ()">Previous</button>${state.q<5?`<button class="btn" type="button" ${state.answers[state.q]===null?'disabled':''} onclick="nextQ()">Next</button>`:`<button id="generateShareBtn" class="btn" type="button" ${canGenerateShare()?'':'disabled'} onclick="showShareCard()">Generate share card</button>`}</div>${!canGenerateShare()&&state.q===5?`<div class="field-help bad" style="margin-top:12px">Complete a valid X username, wallet, and all six answers before generating the share card.</div>`:''}</div><div class="card"><div class="eyebrow">Genesis Signal</div><div class="bitline">${safeSignal()}</div><p style="margin-top:18px">Participant identity only. It does not affect GTD/FCFS selection, NFT family, visual traits, rarity or Market Genome.</p>${showShare?`<div class="share-card" style="margin-top:18px"><div class="share-visual"><img src="${SHARE_CARD_IMG}" alt="Candlekin Genesis Signal universal share card"></div><div class="share-caption-preview"><div class="tiny">Caption on X</div><pre>${escapeHtml(shareCaption())}</pre></div><div class="actions"><button class="btn" type="button" onclick="shareOnX()">Share on X</button><button class="btn ghost" type="button" onclick="copyShareText()">${state.copyStatus||'Copy caption'}</button></div>${state.shareStatus?`<div class="notice success" style="margin-top:14px">${escapeHtml(state.shareStatus)}</div>`:''}<div class="share-help">The image is universal. Your 12-bit Genesis Signal stays in the caption only. Share on X also includes a Candlekin preview link so X can render the card image.</div></div><div style="height:18px"></div><label for="sharedUrl">Shared post URL</label><input id="sharedUrl" value="${escapeHtml(state.form.sharedUrl)}" oninput="updateField('sharedUrl',this.value)" placeholder="https://x.com/username/status/..."><div id="sharedHelp" class="field-help">Paste the URL of the X post you just published.</div>${checklistHtml()}<div class="actions"><button id="submitApplicationBtn" class="btn" type="button" ${canSubmit()?'':'disabled'} onclick="submitPreviewApplication()">Submit preview</button></div>${state.applicationSubmitted?`<div class="notice success" style="margin-top:16px"><strong>APPLICATION RECEIVED</strong><br>Genesis Signal: <span class="mono">${safeSignal()}</span><br>Status: UNDER REVIEW</div>`:''}`:''}</div></div></div></section>`}
function signalMatrix(){let cells='';for(let i=0;i<4096;i++)cells+=`<div class="cell ${(i%127===0||i%193===0)&&i<1800?'lit':''}"></div>`;return `<div class="card"><div class="eyebrow">Supply matrix</div><h3 style="font-size:29px">4,096 token slots</h3><p>A complete 64 × 64 visualization of the fixed supply.</p><div class="matrix-shell"><div class="matrix" aria-hidden="true">${cells}</div></div></div>`}
function checkerHome(){return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>Checker open</span><span class="chip">GTD / FCFS</span></div><div class="eyebrow">Candlekin // allocation</div><h1>Check your allocation.</h1><p class="lead">Final whitelist outcomes are GTD or FCFS. Wallets outside both allowlists can wait for Public.</p></div>${heroArt('Checker phase')}</div></section><section id="checker"><div class="wrap status-grid"><div class="card"><div class="eyebrow">Allocation checker</div><h2>Wallet status.</h2><div class="notice">Preview: <span class="mono">0x1111...1111</span> = GTD, <span class="mono">0x2222...2222</span> = FCFS. Other valid wallets = Public-only.</div><div style="height:18px"></div><label>Wallet address</label><input id="checkerInput" placeholder="0x..."><div class="actions"><button class="btn" type="button" onclick="runChecker()">Check status</button></div><div id="checkerResult" class="checker-result"></div></div>${signalMatrix()}</div></section>${faq()}`}
function mintEraHome(title,desc){const label=state.phase==='GTD_MINT'?'GTD':state.phase==='FCFS_MINT'?'FCFS':'PUBLIC';return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>${label} stage live</span><span class="chip">OpenSea</span></div><div class="eyebrow">Candlekin // mint era</div><h1>${title}</h1><p class="lead">${desc}</p><div class="actions"><button class="btn" type="button" onclick="setPage('mint')">View mint stage</button></div></div>${heroArt(label+' mint')}</div></section>${journeySection()}${faq()}`}
function mintPage(){if(!['GTD_MINT','FCFS_MINT','PUBLIC_MINT'].includes(state.phase))return home();const label=state.phase==='GTD_MINT'?'GTD':state.phase==='FCFS_MINT'?'FCFS':'PUBLIC';const price=label==='GTD'?'0 ETH':label==='FCFS'?'TBD':'0.0005 ETH current direction';const allocation=label==='GTD'?'1 guaranteed':label==='FCFS'?'Allowlisted / FCFS':'Open to all';return `<section class="hero"><div class="wrap"><div class="chips"><span class="chip"><span class="dot"></span>${label} on OpenSea</span></div><div class="eyebrow">Candlekin // mint</div><h1>${label} mint.</h1><p class="lead">The Candlekin website is the identity layer. Primary mint execution will happen on OpenSea.</p></div></section><section><div class="wrap mint-grid"><div class="card"><div class="eyebrow">OpenSea stage</div><h2>${label}</h2><div class="list"><div class="list-row"><span>Stage</span><strong>${label}</strong></div><div class="list-row"><span>Price</span><strong>${price}</strong></div><div class="list-row"><span>Access</span><strong>${allocation}</strong></div></div><div class="actions"><button class="btn" type="button" disabled>OpenSea URL pending</button></div></div>${heroArt('Pre-reveal mint art')}</div></section>`}
function collectionPage(){const revealed=state.phase==='REVEALED';if(!state.walletConnected)return `<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Collection // My Candlekin</div><h1>View your Candlekin.</h1><p class="lead">Preview ownership state only. Production will read the connected wallet.</p><div class="actions"><button class="btn" type="button" onclick="connectWallet()">Preview connected state</button></div></div>${heroArt(revealed?'Revealed collection':'Sealed collection')}</div></section>`;return `<section class="hero"><div class="wrap"><div class="chips"><span class="chip">3 demo Candlekin</span></div><div class="eyebrow">Collection // My Candlekin</div><h1>Your collection.</h1><div class="actions"><button class="btn secondary" type="button" onclick="disconnectWallet()">Disconnect preview</button></div></div></section><section><div class="wrap"><div class="nft-grid">${state.owned.map(id=>{const d=demoOwned[id],g=demoGenomeFor(id);return `<div class="card nft-card"><img src="${HERO_IMG}" alt="Candlekin #${id} preview"><div class="token">Candlekin #${String(id).padStart(4,'0')}</div>${revealed?`<div class="list"><div class="list-row"><span>Family</span><strong>${d.family}</strong></div><div class="list-row"><span>Market Genome</span><strong class="mono">${g.bits}</strong></div></div><div class="actions"><button class="btn small" onclick="openGenome(${id})">Open in Market Lab</button></div>`:`<p>Final family, traits and Market Genome remain sealed.</p>`}</div>`}).join('')}</div></div></section>`}
function marketLab(){if(state.phase!=='REVEALED')return home();const id=state.labId||1842,g=demoGenomeFor(id);return `<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Candlekin // Market Lab</div><h1>Decode the state.</h1><p class="lead">Market Lab interprets the post-Reveal 12-bit Market Genome.</p></div><div class="card"><div class="eyebrow">Selected token</div><img src="${HERO_IMG}" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;margin-bottom:18px"><h3>Candlekin #${String(id).padStart(4,'0')}</h3><div class="bitline">${g.bits}</div></div></div></section><section><div class="wrap genome-grid"><div class="card"><div class="eyebrow">Momentum</div><div class="profile-word">${band('m',g.m)}</div><div class="meter"><span style="width:${g.mp}%"></span></div><p>${g.mp}%</p></div><div class="card"><div class="eyebrow">Volatility</div><div class="profile-word">${band('v',g.v)}</div><div class="meter"><span style="width:${g.vp}%"></span></div><p>${g.vp}%</p></div><div class="card"><div class="eyebrow">Conviction</div><div class="profile-word">${band('c',g.c)}</div><div class="meter"><span style="width:${g.cp}%"></span></div><p>${g.cp}%</p></div></div></section>`}
function adminPage(){const gtd=state.applicants.filter(a=>a.decision==='GTD').length,fcfs=state.applicants.filter(a=>a.decision==='FCFS').length,pending=state.applicants.length-gtd-fcfs;return `<section class="hero"><div class="wrap"><div class="chips"><span class="chip">Internal preview only</span></div><div class="eyebrow">Curation mock</div><h2>Whitelist curation.</h2><p class="lead">Each applicant can be GTD, FCFS, or left unselected for Public.</p><div class="kpi"><div class="card"><div class="tiny">Applicants</div><div class="n">${state.applicants.length}</div></div><div class="card"><div class="tiny">Pending / Public-only</div><div class="n">${pending}</div></div><div class="card"><div class="tiny">GTD</div><div class="n">${gtd}</div></div><div class="card"><div class="tiny">FCFS</div><div class="n">${fcfs}</div></div></div><div class="table-wrap"><table><thead><tr><th>Application</th><th>X</th><th>Wallet</th><th>Genesis</th><th>Decision</th></tr></thead><tbody>${state.applicants.map((a,i)=>`<tr><td>${a.id}</td><td>${a.x}</td><td>${a.wallet}</td><td style="color:var(--lime)">${a.signal}</td><td><div style="display:flex;gap:8px"><button class="btn small ${a.decision==='GTD'?'':'secondary'}" onclick="setDecision(${i},'GTD')">GTD</button><button class="btn small ${a.decision==='FCFS'?'':'secondary'}" onclick="setDecision(${i},'FCFS')">FCFS</button><button class="btn small secondary" onclick="setDecision(${i},'')">Clear</button></div></td></tr>`).join('')}</tbody></table></div></div></section>`}
function pageHtml(){if(state.phase==='CURATION_ADMIN')return adminPage();if(state.page==='whitelist')return whitelistPage();if(state.page==='mint')return mintPage();if(state.page==='collection')return collectionPage();if(state.page==='marketlab')return marketLab();if(state.page==='faq')return faq();return home()}
function render(){const meta=phases[state.phase];document.getElementById('topStatus').textContent=meta.status;document.getElementById('headerCta').textContent=meta.cta;document.getElementById('phaseHelp').textContent=meta.help;document.getElementById('phaseSelect').value=state.phase;const allowed=availablePages();if(!allowed.includes(state.page))state.page=allowed[0];renderNav();document.getElementById('app').innerHTML=pageHtml()+'<div class="footspace"></div>';syncWhitelistValidity()}
function setPage(p){if(!availablePages().includes(p))return;state.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function pickAnswer(q,i){state.answers[q]=i;state.applicationSubmitted=false;render()}
function nextQ(){if(state.q<5&&state.answers[state.q]!==null){state.q++;render()}}
function prevQ(){if(state.q>0){state.q--;render()}}
function showShareCard(){if(!canGenerateShare())return;state.q=6;state.shareStatus='';state.applicationSubmitted=false;render()}
function connectWallet(){state.walletConnected=true;render()}function disconnectWallet(){state.walletConnected=false;render()}
function openGenome(id){state.labId=id;state.page='marketlab';render();window.scrollTo({top:0,behavior:'smooth'})}
function setDecision(i,v){state.applicants[i].decision=v;render()}
function updateField(k,v){state.form[k]=v;state.applicationSubmitted=false;syncWhitelistValidity()}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function markField(id,ok,helpId,good,bad){const el=document.getElementById(id),help=document.getElementById(helpId);if(!el||!help)return;const has=el.value.trim().length>0;el.classList.toggle('valid',has&&ok);el.classList.toggle('invalid',has&&!ok);help.className='field-help '+(has?(ok?'good':'bad'):'');help.textContent=has?(ok?good:bad):'Required.'}
function syncWhitelistValidity(){markField('xUser',validX(),'xHelp','X username looks valid.','Use a valid X username.');markField('wallet',validWallet(),'walletHelp','Wallet looks valid.','Enter a full 0x + 40 hex wallet.');markField('sharedUrl',validSharedPost(),'sharedHelp','X post URL looks valid.','Use an X post URL like https://x.com/user/status/123...');const gen=document.getElementById('generateShareBtn');if(gen)gen.disabled=!canGenerateShare();const submit=document.getElementById('submitApplicationBtn');if(submit)submit.disabled=!canSubmit()}
async function copyShareText(){try{await navigator.clipboard.writeText(shareCaption());state.copyStatus='Copied';render();setTimeout(()=>{state.copyStatus='';render()},1200)}catch{state.copyStatus='Copy failed';render()}}
function shareOnX(){if(!shareGenerated())return;const intent=`https://x.com/intent/post?text=${encodeURIComponent(shareCaption())}&url=${encodeURIComponent(sharePageUrl())}`;state.shareStatus='X opened with your caption and the universal Candlekin share-card link. After posting, paste the X post URL below.';render();const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);if(mobile){location.href=intent;return}const a=document.createElement('a');a.href=intent;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove()}
function submitPreviewApplication(){if(!canSubmit()){syncWhitelistValidity();return}state.applicationSubmitted=true;render()}
function runChecker(){const v=(document.getElementById('checkerInput')?.value||'').trim().toLowerCase(),box=document.getElementById('checkerResult');if(!box)return;box.classList.add('active');if(!/^0x[a-f0-9]{40}$/.test(v)){box.innerHTML=`<div class="card"><div class="result-badge none">Invalid wallet</div><p style="margin-top:12px">Enter a valid EVM wallet address.</p></div>`;return}const r=checkerDB[v];if(r==='GTD'){box.innerHTML=`<div class="card"><div class="result-badge gtd">GTD</div><h3 style="margin-top:12px">Guaranteed allowlist.</h3><div class="list"><div class="list-row"><span>Tier</span><strong>GTD</strong></div><div class="list-row"><span>Next</span><strong>GTD presale on OpenSea</strong></div></div></div>`;return}if(r==='FCFS'){box.innerHTML=`<div class="card"><div class="result-badge fcfs">FCFS</div><h3 style="margin-top:12px">FCFS allowlist.</h3><div class="list"><div class="list-row"><span>Tier</span><strong>FCFS</strong></div><div class="list-row"><span>Guarantee</span><strong>No — first come, first served</strong></div></div></div>`;return}box.innerHTML=`<div class="card"><div class="result-badge none">Public only</div><h3 style="margin-top:12px">Not on the presale allowlists.</h3><p>You can still participate when Public opens on OpenSea.</p></div>`}
document.getElementById('phaseSelect').addEventListener('change',e=>{state.phase=e.target.value;state.page=availablePages()[0];const u=new URL(location.href);u.searchParams.set('phase',state.phase);history.replaceState(null,'',u);render()});
document.getElementById('phaseToggle').addEventListener('click',()=>document.getElementById('phaseBody').classList.toggle('hidden'));
document.getElementById('headerCta').addEventListener('click',()=>{if(state.phase==='WHITELIST_OPEN'||state.phase==='WHITELIST_CLOSED')setPage('whitelist');else if(state.phase==='CHECKER_OPEN'){setPage('home');setTimeout(()=>document.getElementById('checker')?.scrollIntoView({behavior:'smooth'}),50)}else if(['GTD_MINT','FCFS_MINT','PUBLIC_MINT'].includes(state.phase))setPage('mint');else if(state.phase==='SOLD_OUT')setPage('collection');else if(state.phase==='REVEALED')setPage('marketlab');else{state.page='admin';render()}});
render();
window.setPage=setPage;window.pickAnswer=pickAnswer;window.nextQ=nextQ;window.prevQ=prevQ;window.showShareCard=showShareCard;window.connectWallet=connectWallet;window.disconnectWallet=disconnectWallet;window.openGenome=openGenome;window.setDecision=setDecision;window.updateField=updateField;window.copyShareText=copyShareText;window.shareOnX=shareOnX;window.submitPreviewApplication=submitPreviewApplication;window.runChecker=runChecker;
</script>
</body>
</html>
