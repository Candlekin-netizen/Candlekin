<body>
<header class="header"><div class="header-inner"><div class="brand"><span class="flame"></span><span>CANDLEKIN</span></div><nav class="nav" id="mainNav"></nav><span class="preview-pill">PROTOTYPE PREVIEW</span><div class="status-pill" id="topStatus"></div><button class="btn" id="headerCta" type="button"></button></div></header>
<main id="app"></main>
<footer class="footer"><div class="wrap footer-inner"><div><strong>CANDLEKIN</strong> — Apply → Mint → Sealed → Reveal → Decode.</div><div>Preview build. No live mint or wallet transaction is enabled.</div></div></footer>
<div class="phasebox hidden" id="phaseBox"><div class="phasehead" id="phaseToggle"><strong class="mono" style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)">Lifecycle // internal</strong><span>▾</span></div><div class="phasebody" id="phaseBody"><select id="phaseSelect" aria-label="Internal lifecycle phase"><option value="WHITELIST_OPEN">WHITELIST_OPEN</option><option value="WHITELIST_CLOSED">WHITELIST_CLOSED</option><option value="CHECKER_OPEN">CHECKER_OPEN</option><option value="GTD_MINT">GTD_MINT</option><option value="PUBLIC_MINT">PUBLIC_MINT</option><option value="SOLD_OUT">SOLD_OUT</option><option value="REVEALED">REVEALED</option><option value="CURATION_ADMIN">CURATION_ADMIN</option></select><div class="phasehelp" id="phaseHelp"></div><div class="internal-actions"><button class="btn small secondary" type="button" id="publicViewBtn">Open public view</button></div></div></div>
<script>
const HERO_IMG='https://res.cloudinary.com/lqk65ybn/image/upload/v1788090258/ChatGPT_Image_Aug_24_2026_11_44_38_AM.png';
const params=new URLSearchParams(location.search);
const internalMode=params.get('internal')==='1'||['localhost','127.0.0.1'].includes(location.hostname);
const validPhases=['WHITELIST_OPEN','WHITELIST_CLOSED','CHECKER_OPEN','GTD_MINT','PUBLIC_MINT','SOLD_OUT','REVEALED','CURATION_ADMIN'];
const requestedPhase=params.get('phase');
const initialPhase=internalMode&&validPhases.includes(requestedPhase)?requestedPhase:'WHITELIST_OPEN';
const phases={
  WHITELIST_OPEN:{status:'Whitelist applications open',cta:'Open whitelist',help:'Public: Home + Whitelist + Collection + FAQ. Mint and Market Lab are hidden.'},
  WHITELIST_CLOSED:{status:'Whitelist review in progress',cta:'View status',help:'Applications are closed. Public waits for allocation checker.'},
  CHECKER_OPEN:{status:'Allocation checker open',cta:'Check allocation',help:'Checker is the primary public action. Unknown wallets return Not Found in preview.'},
  GTD_MINT:{status:'GTD mint live',cta:'Open mint',help:'GTD phase presentation only. Contract writes remain disabled in this preview.'},
  PUBLIC_MINT:{status:'Public mint live',cta:'Open mint',help:'Public mint presentation only. Current concept price is 0.0005 ETH; contract writes remain disabled.'},
  SOLD_OUT:{status:'Sold out // pre-reveal',cta:'View collection',help:'Mint is complete. Owned Candlekin remain sealed until reveal.'},
  REVEALED:{status:'Reveal live',cta:'Open Market Lab',help:'Final art, traits and Market Genome presentation becomes visible.'},
  CURATION_ADMIN:{status:'Internal curation preview',cta:'Admin',help:'Internal UI mock only. This route is never exposed from the public navigation.'}
};
const demoOwned={
  1842:{family:'Bearkin',bits:'1010 0110 1101'},
  2291:{family:'Bullkin',bits:'0011 1100 1001'},
  3807:{family:'Bearkin',bits:'1110 1001 0100'}
};
const state={
  phase:initialPhase,page:'home',answers:Array(6).fill(null),q:0,qty:1,walletConnected:false,owned:[1842,2291,3807],labId:1842,
  form:{x:'',wallet:'',sharedUrl:'',response:''},applicationSubmitted:false,copyStatus:'',
  applicants:[
    {id:'CK-01801',x:'@pixelmarc',wallet:'0xbbb...12df',signal:'0000 0000 0000',social:'PARTIAL',sybil:'MED',score:86,decision:''},
    {id:'CK-01802',x:'@chainlena',wallet:'0xccc...7ad1',signal:'0001 0011 1101',social:'VERIFIED',sybil:'LOW',score:72,decision:''},
    {id:'CK-01803',x:'@bulltape',wallet:'0xddd...8be1',signal:'0010 0111 1010',social:'VERIFIED',sybil:'LOW',score:91,decision:'GTD'},
    {id:'CK-01804',x:'@0xsignal',wallet:'0xeee...e011',signal:'0011 1011 0111',social:'VERIFIED',sybil:'HIGH',score:41,decision:'PUBLIC'},
    {id:'CK-01805',x:'@candleframe',wallet:'0xfff...aac1',signal:'0100 0110 1001',social:'VERIFIED',sybil:'LOW',score:77,decision:''}
  ]
};
const qs=[
 ['When the market accelerates, what do you trust first?',['Momentum','Structure','Volume','Confirmation']],
 ['A signal appears before the crowd reacts. What is your instinct?',['Observe','Enter Early','Wait For Confirmation','Ignore The Noise']],
 ['Which market state feels most natural to read?',['Trending','Volatile','Compressed','Reversing']],
 ['When two signals conflict, what matters most?',['Patience','Conviction','Risk Control','Adaptability']],
 ['Which type of move catches your attention first?',['Breakout','Reversal','Acceleration','Range Expansion']],
 ['What defines a strong market signal to you?',['Timing','Clarity','Persistence','Alignment']]
];
const checkerDB={
 '0x1111111111111111111111111111111111111111':'GTD',
 '0x2222222222222222222222222222222222222222':'PUBLIC',
 '0x3333333333333333333333333333333333333333':'GTD'
};
function safeSignal(){return state.answers.map(a=>a===null?'00':['00','01','10','11'][a]).join(' ')}
function parseGenome(bits){const clean=bits.replace(/ /g,''),m=parseInt(clean.slice(0,4),2),v=parseInt(clean.slice(4,8),2),c=parseInt(clean.slice(8),2);return{bits,m,v,c,mp:Math.round(m/15*100),vp:Math.round(v/15*100),cp:Math.round(c/15*100)}}
function demoGenomeFor(id){if(demoOwned[id])return parseGenome(demoOwned[id].bits);const n=((id*1493)+827)%4096;return parseGenome(n.toString(2).padStart(12,'0').replace(/(.{4})(.{4})(.{4})/,'$1 $2 $3'))}
function band(type,n){if(type==='m')return['DORMANT','BUILDING','ACTIVE','SURGING'][Math.min(3,Math.floor(n/4))];if(type==='v')return['STABLE','RESPONSIVE','VOLATILE','EXTREME'][Math.min(3,Math.floor(n/4))];return['FLEXIBLE','MEASURED','FIRM','ABSOLUTE'][Math.min(3,Math.floor(n/4))]}
function availablePages(){
  if(state.phase==='CURATION_ADMIN')return internalMode?['admin']:['home'];
  if(state.phase==='WHITELIST_OPEN'||state.phase==='WHITELIST_CLOSED')return['home','whitelist','collection','faq'];
  if(state.phase==='CHECKER_OPEN')return['home','collection','faq'];
  if(state.phase==='GTD_MINT'||state.phase==='PUBLIC_MINT')return['home','mint','collection','faq'];
  if(state.phase==='SOLD_OUT')return['home','collection','faq'];
  if(state.phase==='REVEALED')return['home','collection','marketlab','faq'];
  return['home'];
}
function renderNav(){const labels={home:'Home',whitelist:'Whitelist',mint:'Mint',collection:'Collection',marketlab:'Market Lab',faq:'FAQ',admin:'Admin'};document.getElementById('mainNav').innerHTML=availablePages().map(p=>`<button type="button" class="${state.page===p?'active':''}" onclick="setPage('${p}')">${labels[p]}</button>`).join('')}
function heroArt(caption2){return `<div class="art-box"><img src="${HERO_IMG}" alt="Candlekin sealed identity artwork"><div class="caption"><span>Identity // sealed</span><span>${caption2}</span></div></div>`}
function collectionOverview(){return `<section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Collection</div><h2>4,096 market states.</h2></div><div class="subtle">A fixed 2,048 Bullkin / 2,048 Bearkin split. Visual DNA and Market Genome remain separate identity layers.</div></div><div class="grid-4"><div class="card stat"><div class="label">Supply</div><div class="value">4,096</div><p>Hard-pixel collection.</p></div><div class="card stat"><div class="label">Bullkin</div><div class="value">2,048</div><p>Fixed family allocation.</p></div><div class="card stat"><div class="label">Bearkin</div><div class="value">2,048</div><p>Fixed family allocation.</p></div><div class="card stat"><div class="label">Genome</div><div class="value">12-bit</div><p>One unique state per NFT after Reveal.</p></div></div></div></section>`}
function identitySection(){return `<section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Identity architecture</div><h2>Three systems. No hidden influence.</h2></div><div class="subtle">Candlekin deliberately separates participant identity, visual appearance and post-Reveal market identity.</div></div><div class="grid-3"><div class="card"><div class="eyebrow">Visual DNA</div><h3>Appearance</h3><p>Background, Head, Body, Body Accessory, Glasses and Special Trait define how a Candlekin looks.</p></div><div class="card highlight"><div class="eyebrow">Market Genome</div><h3>Permanent NFT identity</h3><p>A unique 12-bit market-state identity revealed after mint. It remains separate from visual rarity and whitelist answers.</p></div><div class="card"><div class="eyebrow">Genesis Signal</div><h3>Participant identity</h3><p>Generated during whitelist calibration. It does not determine family, rarity, token ID, Visual DNA or Market Genome.</p></div></div></div></section>`}
function journeySection(){return `<section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Collector journey</div><h2>Apply → Mint → Sealed → Reveal → Decode.</h2></div></div><div class="journey"><div class="journey-step"><span>01</span><strong>Apply</strong><p>Register a Genesis Signal and enter review.</p></div><div class="journey-step"><span>02</span><strong>Mint</strong><p>GTD first, then Public from remaining supply.</p></div><div class="journey-step"><span>03</span><strong>Sealed</strong><p>Ownership exists while final identity stays hidden.</p></div><div class="journey-step"><span>04</span><strong>Reveal</strong><p>Final art, traits and Market Genome become visible.</p></div><div class="journey-step"><span>05</span><strong>Decode</strong><p>Explore the genome in Market Lab.</p></div></div></div></section>`}
function artSection(){return `<section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Visual system</div><h2>Modular hard-pixel DNA.</h2></div><div class="subtle">Current concept architecture uses six public trait categories and 26 background identities: 20 solid states plus 6 curated legendary worlds.</div></div><div class="grid-2"><div class="card"><h3>Trait architecture</h3><div class="list"><div class="list-row"><span>01</span><strong>Background</strong></div><div class="list-row"><span>02</span><strong>Head</strong></div><div class="list-row"><span>03</span><strong>Body</strong></div><div class="list-row"><span>04</span><strong>Body Accessory</strong></div><div class="list-row"><span>05</span><strong>Glasses</strong></div><div class="list-row"><span>06</span><strong>Special Trait</strong></div></div></div><div class="card"><h3>Fairness principle</h3><p>Whitelist answers, wallet identity and Genesis Signal do not influence final NFT traits or Market Genome. Final production mapping must remain deterministic, auditable and free from post-mint manual trait manipulation.</p><div class="notice">The exact production Market Genome assignment algorithm is still a project decision. Any genome shown in this preview is demo data only.</div></div></div></div></section>`}
function faq(){return `<section><div class="wrap"><div class="section-head"><div><div class="eyebrow">FAQ</div><h2>What matters.</h2></div></div><div class="grid-2"><div class="card"><h3>What is Genesis Signal?</h3><p>A 12-bit participant identity created during whitelist calibration. It does not decide rarity, traits, family, token ID or Market Genome.</p></div><div class="card"><h3>What is GTD?</h3><p>A guaranteed allocation selected from the whitelist applicant pool. Current direction: one guaranteed free mint; exact GTD count and claim duration are not yet locked.</p></div><div class="card"><h3>What is Public Mint?</h3><p>The open mint phase after GTD. Current concept direction is 0.0005 ETH per NFT; public wallet limit and launch timing are still TBD.</p></div><div class="card"><h3>What is Market Lab?</h3><p>A post-Reveal identity explorer for Market Genome: decoder, profile, compare, share card and Genome Atlas. It is not a trading signal service.</p></div></div></div></section>`}

cipant identity only. It does not affect NFT family, visual traits, rarity, mint result or Market Genome.</p>${showShare?`<div class="share-card" style="margin-top:18px"><div class="tiny">Candlekin</div><div class="big">Signal registered.</div><div class="tiny">Genesis Signal</div><div class="bitline" style="font-size:22px">${safeSignal()}</div><p style="margin-top:16px">My Candlekin signal is registered.<br>${safeSignal()}<br>@Candlekin</p></div><div style="height:18px"></div><label for="sharedUrl">Shared post URL</label><input id="sharedUrl" value="${escapeHtml(state.form.sharedUrl)}" oninput="updateField('sharedUrl',this.value)" placeholder="https://x.com/..."><div style="height:16px"></div><label for="response">What makes Candlekin worth holding after Reveal?</label><textarea id="response" oninput="updateField('response',this.value)" placeholder="Write your answer...">${escapeHtml(state.form.response)}</textarea><div class="actions"><button class="btn ghost" type="button" onclick="copyShareText()">${state.copyStatus||'Copy share text'}</button><button class="btn" type="button" onclick="submitPreviewApplication()">Submit preview</button></div>${state.applicationSubmitted?`<div class="notice success" style="margin-top:16px">Preview submission validated locally. Nothing was sent to a backend.</div>`:''}`:''}</div></div></div></section>`;
}

function mintEraHome(title,desc){return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>${state.phase==='GTD_MINT'?'GTD mint live':'Public mint live'}</span><span class="chip">Preview state</span></div><div class="eyebrow">Candlekin // mint era</div><h1>${title}</h1><p class="lead">${desc}</p><div class="actions"><button class="btn" type="button" onclick="setPage('mint')">Open mint</button><button class="btn secondary" type="button" onclick="setPage('collection')">My Candlekin</button></div></div>${heroArt(state.phase==='GTD_MINT'?'GTD mint':'Public mint')}</div></section>${collectionOverview()}${journeySection()}${faq()}`}

progress}% preview minted</h3><div class="supply-meter"><span style="width:${progress}%"></span></div><p style="margin-top:14px">Display data only. Production supply will be authoritative onchain state.</p></div><div class="card"><div class="eyebrow">Reveal policy</div><div class="list"><div class="list-row"><span>Minted NFT</span><strong>Owned immediately</strong></div><div class="list-row"><span>Artwork</span><strong>Sealed</strong></div><div class="list-row"><span>Market Genome</span><strong>Hidden</strong></div></div></div></div></div></section>`

  if(!state.walletConnected)return `<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Collection // My Candlekin</div><h1>View your Candlekin.</h1><p class="lead">Collection is personal by design. The production site will load only NFTs owned by the connected wallet instead of rendering all 4,096 tokens through raw RPC calls.</p><div class="notice">Wallet connection below is simulated for layout testing. No wallet provider is contacted.</div><div class="actions"><button class="btn" type="button" onclick="connectWallet()">Preview connected state</button></div></div>${heroArt(revealed?'Revealed collection':'Sealed collection')}</div></section><section><div class="wrap grid-3"><div class="card"><h3>Lightweight</h3><p>Only owned token IDs and required metadata need to be loaded.</p></div><div class="card"><h3>Before Reveal</h3><p>Owned NFTs show token ID and sealed artwork.</p></div><div class="card"><h3>After Reveal</h3><p>Final art, traits and Market Genome become visible.</p></div></div></section>`;

lue">${g.cp}%</div></div><div class="profile-word">${band('c',g.c)}</div><div class="meter"><span style="width:${g.cp}%"></span></div><p style="margin-top:14px">${g.c} / 15</p></div></div></div></section><section><div class="wrap grid-2"><div class="card"><div class="eyebrow">Market Profile</div><h2 style="font-size:38px">${band('m',g.m)} / ${band('v',g.v)} / ${band('c',g.c)}</h2><p>This profile is generated compositionally from the three genome axes.</p><button class="btn" type="button" disabled>Share Card — later</button></div><div class="card"><div class="eyebrow">Genome Anatomy</div><div class="bitline">${g.bits}</div><div class="list" style="margin-top:18px"><div class="list-row"><span>Bits 01–04</span><strong>Momentum</strong></div><div class="list-row"><span>Bits 05–08</span><strong>Volatility</strong></div><div class="list-row"><span>Bits 09–12</span><strong>Conviction</strong></div></div></div></div></section><section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Compare</div><h2>Two genomes, side by side.</h2></div></div><div class="card compare-grid"><div><div class="eyebrow">Candlekin #${String(id).padStart(4,'0')}</div><div class="bitline" style="font-size:20px">${g.bits}</div><p>${g.mp}% Momentum · ${g.vp}% Volatility · ${g.cp}% Conviction</p></div><div class="vs">VS</div><div><div class="eyebrow">Candlekin #0912</div><div class="bitline" style="font-size:20px">${g2.bits}</div><p>${g2.mp}% Momentum · ${g2.vp}% Volatility · ${g2.cp}% Conviction</p></div></div></div></section><section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Genome Atlas</div><h2>4,096 possible states.</h2></div><div class="subtle">A true 64 × 64 mathematical state-space. This is not a 4,096-item RPC gallery.</div></div>${genomeAtlas(g)}</div></section>`

function adminPage(){if(!internalMode)return home();const gtd=state.applicants.filter(a=>a.decision==='GTD').length,pub=state.applicants.filter(a=>a.decision==='PUBLIC').length,pending=state.applicants.length-gtd-pub,flagged=state.applicants.filter(a=>a.sybil==='HIGH').length;return `<section class="hero"><div class="wrap"><div class="chips"><span class="chip">Internal preview only</span></div><div class="eyebrow">Curation mock</div><h2>Whitelist curation.</h2><p class="lead">This screen exists only for internal UX testing. Production curation authority and storage are not implemented here.</p><div class="kpi"><div class="card"><div class="tiny">Applicants</div><div class="n">${state.applicants.length}</div></div><div class="card"><div class="tiny">Pending</div><div class="n">${pending}</div></div><div class="card"><div class="tiny">GTD</div><div class="n">${gtd}</div></div><div class="card"><div class="tiny">Public</div><div class="n">${pub}</div></div><div class="card"><div class="tiny">Flagged</div><div class="n">${flagged}</div></div></div><div class="toolbar"><input style="max-width:230px" placeholder="Search X / wallet" disabled><select style="max-width:180px" disabled><option>All</option></select><button class="btn secondary" type="button" disabled>Export CSV</button><button class="btn" type="button" disabled>Finalize GTD list</button></div><div class="table-wrap"><table><thead><tr><th>Application</th><th>X</th><th>Wallet</th><th>Genesis</th><th>Social</th><th>Sybil</th><th>Score</th><th>Decision</th></tr></thead><tbody>${state.applicants.map((a,i)=>`<tr><td>${a.id}</td><td>${a.x}</td><td>${a.wallet}</td><td style="color:var(--lime)">${a.signal}</td><td class="${a.social==='VERIFIED'?'good':'warn'}">${a.social}</td><td class="${a.sybil==='LOW'?'good':a.sybil==='MED'?'warn':'bad'}">${a.sybil}</td><td>${a.score}</td><td><div style="display:flex;gap:8px"><button class="btn small ${a.decision==='GTD'?'':'secondary'}" type="button" onclick="setDecision(${i},'GTD') function pageHtml(){if(state.phase==='CURATION_ADMIN'&&internalMode)return adminPage();if(state.page==='whitelist')return whitelistPage();if(state.page==='mint')return mintPage();if(state.page==='collection')return collectionPage();if(state.page==='marketlab')return marketLab();if(state.page==='faq')return faq();return home()}
function render(){const meta=phases[state.phase];document.getElementById('topStatus').textContent=meta.status;document.getElementById('headerCta').textContent=meta.cta;document.getElementById('phaseHelp').textContent=meta.help;document.getElementById('phaseSelect').value=state.phase;const allowed=availablePages();if(!allowed.includes(state.page))state.page=allowed[0];renderNav();document.getElementById('app').innerHTML=pageHtml()+'<div class="footspace"></div>'}
function setPage(p){if(!availablePages().includes(p))return;state.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function pickAnswer(q,i){state.answers[q]=i;render()}function nextQ(){if(state.q<5&&state.answers[state.q]!==null){state.q++;render()}}function prevQ(){if(state.q>0){state.q--;render()}}function showShareCard(){if(state.answers[5]!==null){state.q=6;render()}}function changeQty(d){state.qty=Math.max(1,Math.min(3,state.qty+d));render()}function connectWallet(){state.walletConnected=true;render()}function disconnectWallet(){state.walletConnected=false;render()}function openGenome(id){state.labId=id;state.page='marketlab';render();window.scrollTo({top:0,behavior:'smooth'})}function searchGenome(){const v=parseInt(document.getElementById('labSearch')?.value||'1842',10);state.labId=Math.max(1,Math.min(4096,isNaN(v)?1842:v));render()}function setDecision(i,v){if(!internalMode)return;state.applicants[i].decision=v;render()}function updateField(k,v){state.form[k]=v}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function copyShareText(){const text=`My Candlekin signal is registered.\n${safeSignal()}\n@Candlekin`;try{await navigator.clipboard.writeText(text);state.copyStatus='Copied';render();setTimeout(()=>{state.copyStatus='';render()},1200)}catch{state.copyStatus='Copy failed';render()}}
function submitPreviewApplication(){const walletOk=/^0x[a-fA-F0-9]{40}$/.test(state.form.wallet.trim());if(!state.form.x.trim()||!walletOk||!state.form.sharedUrl.trim()||state.form.response.trim().length<10){alert('Preview validation: fill X username, a valid EVM wallet, shared post URL, and a meaningful response.');return}state.applicationSubmitted=true;render()}
function runChecker(){const v=(document.getElementById('checkerInput')?.value||'').trim().toLowerCase(),box=document.getElementById('checkerResult');if(!box)return;box.classList.add('active');if(!/^0x[a-f0-9]{40}$/.test(v)){box.innerHTML=`<div class="card"><div class="result-badge none">Invalid wallet</div><p style="margin-top:12px">Enter a valid EVM wallet address.</p></div>`;return}const r=checkerDB[v];if(!r){box.innerHTML=`<div class="card"><div class="result-badge none">Not found</div><h3 style="margin-top:12px">No preview application found.</h3><p>Production behavior for non-applicant wallets will be finalized with the checker data source.</p></div>`;return}box.innerHTML=r==='GTD'?`<div class="card"><div class="result-badge gtd">GTD</div><h3 style="margin-top:12px">Guaranteed allocation confirmed.</h3><div class="list"><div class="list-row"><span>Allocation</span><strong>1</strong></div><div class="list-row"><span>Price</span><strong>0 ETH</strong></div><div class="list-row"><span>Next phase</span><strong>GTD Mint</strong></div></div></div>`:`<div class="card"><div class="result-badge public">Public</div><h3 style="margin-top:12px">Public access.</h3><div class="list"><div class="list-row"><span>Guaranteed allocation</span><strong>None</strong></div><div class="list-row"><span>Current concept price</span><strong>0.0005 ETH</strong></div><div class="list-row"><span>Next phase</span><strong>Public Mint</strong></div></div></div>`}
if(internalMode)document.getElementById('phaseBox').classList.remove('hidden');
document.getElementById('phaseSelect').addEventListener('change',e=>{if(!internalMode)return;state.phase=e.target.value;state.page=availablePages()[0];const u=new URL(location.href);u.searchParams.set('internal','1');u.searchParams.set('phase',state.phase);history.replaceState(null,'',u);render()});
document.getElementById('phaseToggle').addEventListener('click',()=>document.getElementById('phaseBody').classList.toggle('hidden'));
document.getElementById('publicViewBtn').addEventListener('click',()=>{const u=new URL(location.href);u.searchParams.delete('internal');u.searchParams.delete('phase');location.href=u.toString()});
document.getElementById('headerCta').addEventListener('click',()=>{if(state.phase==='WHITELIST_OPEN'||state.phase==='WHITELIST_CLOSED'){setPage('whitelist')}else if(state.phase==='CHECKER_OPEN'){setPage('home');setTimeout(()=>document.getElementById('checker')?.scrollIntoView({behavior:'smooth'}),50)}else if(state.phase==='GTD_MINT'||state.phase==='PUBLIC_MINT'){setPage('mint')}else if(state.phase==='SOLD_OUT'){setPage('collection')}else if(state.phase==='REVEALED'){setPage('marketlab')}else if(internalMode){state.page='admin';render()}});
render();
window.setPage=setPage;window.pickAnswer=pickAnswer;window.nextQ=nextQ;window.prevQ=prevQ;window.showShareCard=showShareCard;window.changeQty=changeQty;window.connectWallet=connectWallet;window.disconnectWallet=disconnectWallet;window.openGenome=openGenome;window.searchGenome=searchGenome;window.setDecision=setDecision;window.updateField=updateField;window.copyShareText=copyShareText;window.submitPreviewApplication=submitPreviewApplication;window.runChecker=runChecker;
</script>
</body>
</html>
