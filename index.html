<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Candlekin — Full Lifecycle Prototype v13</title>
  <style>
    :root{
      --bg:#07101a;--bg2:#0b1521;--panel:#0d1826;--line:#1d2d40;
      --text:#efe7d1;--muted:#9ba8b6;--lime:#ccff00;--lime2:#b6e91b;
      --good:#8dff7c;--warn:#ffd36b;--bad:#ff7c7c;
      --radius:16px;--wrap:min(1380px,calc(100% - 48px));--shadow:0 10px 28px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),radial-gradient(circle at 86% 7%,rgba(204,255,0,.08),transparent 28%),#07101a;background-size:28px 28px,28px 28px,auto,auto;overflow-x:hidden}
    h1,h2,h3{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.03em;margin:0 0 14px}h1{font-size:clamp(50px,7vw,94px);line-height:.95}h2{font-size:clamp(30px,4vw,48px);line-height:1}h3{font-size:21px}p{margin:0 0 14px;color:#c8d1da;line-height:1.75}
    .mono,.btn,.chip,.eyebrow,.status-pill,input,textarea,select,table{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.wrap{width:var(--wrap);margin:0 auto}.muted{color:var(--muted)}.hidden{display:none!important}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--lime);margin-bottom:15px}.lead{font-size:20px;line-height:1.72;max-width:720px;color:#d0d8e0}
    .header{position:sticky;top:0;z-index:50;background:rgba(7,16,26,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.header-inner{width:var(--wrap);margin:0 auto;height:76px;display:flex;align-items:center;gap:26px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em;white-space:nowrap}.flame{width:14px;height:22px;background:var(--lime);clip-path:polygon(50% 0,82% 30%,72% 52%,100% 77%,67% 100%,33% 100%,0 77%,28% 52%,18% 30%)}
    .nav{margin-left:auto;display:flex;align-items:center;gap:22px;flex-wrap:wrap}.nav button{background:none;border:0;color:#b8c3ce;padding:0;cursor:pointer;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.nav button:hover,.nav button.active{color:var(--lime)}.status-pill{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:999px;padding:10px 14px;font-size:12px;color:#bac5d0;white-space:nowrap}
    .btn{appearance:none;border:1px solid #afd021;background:var(--lime);color:#091117;border-radius:12px;padding:13px 18px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}.btn.secondary{background:transparent;color:var(--text);border-color:#33495f;box-shadow:none}.btn.ghost{background:transparent;color:var(--lime);border-color:#3e5548;box-shadow:none}.btn.small{padding:9px 12px;font-size:12px}.btn:disabled{opacity:.38;cursor:not-allowed}
    section{padding:30px 0 58px}.hero{padding:58px 0 36px}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:999px;padding:8px 12px;font-size:12px;color:#d7dfd1}.dot{width:7px;height:7px;background:var(--lime);border-radius:999px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
    .art-box,.hero-art{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:22px;padding:18px}.hero-art img,.art-box img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:16px}.caption{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    .section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}.subtle{max-width:560px;color:var(--muted);font-size:14px;line-height:1.6}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.status-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:18px}.mint-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:var(--radius);padding:22px;min-width:0}.stat .label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}.stat .value{font-family:Georgia,"Times New Roman",serif;font-size:36px;margin-bottom:8px}.flow-step{display:flex;gap:14px;align-items:flex-start}.step-num{width:34px;height:34px;border:1px solid #41533f;border-radius:999px;color:var(--lime);display:grid;place-items:center;flex:0 0 auto}
    label{display:block;color:#9fb0c0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}input,textarea,select{width:100%;background:var(--bg2);color:var(--text);border:1px solid #2c4157;border-radius:12px;padding:14px;font-size:14px}textarea{min-height:120px;resize:vertical}.question{margin-top:20px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}.option{background:var(--bg2);border:1px solid #2c4157;border-radius:12px;padding:14px;color:#d9e1e8;text-align:left;cursor:pointer}.option.active{border-color:#8dac24;background:rgba(204,255,0,.08)}.bitline{font-size:27px;letter-spacing:.34em;color:var(--lime2)}.share-card{background:linear-gradient(135deg,#0b1521,#101d2b 62%,rgba(204,255,0,.07));border:1px solid var(--line);border-radius:18px;padding:24px}.share-card .big{font-family:Georgia,"Times New Roman",serif;font-size:42px;line-height:1.05;margin:12px 0}.tiny{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
    .result-badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;letter-spacing:.11em;text-transform:uppercase}.result-badge.gtd{color:var(--lime);border-color:#4b5d21}.result-badge.public{color:#e1e6ec}.checker-result{display:none;margin-top:18px}.checker-result.active{display:block}.list{display:grid;gap:10px}.list-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
    .matrix-shell{padding:14px;border:1px solid #25384d;border-radius:14px;background:#0a1420}.matrix{display:grid;grid-template-columns:repeat(32,1fr);gap:2px}.cell{aspect-ratio:1/1;background:#122236;border-radius:2px}.cell.lit{background:var(--lime)}.cell.mine{background:#efe7d1}.supply-meter{height:12px;border:1px solid #273a4f;background:#0a1420;border-radius:999px;overflow:hidden}.supply-meter span{display:block;height:100%;background:var(--lime)}
    .qty{display:flex;align-items:center;gap:12px}.qty button{width:42px;height:42px;border-radius:12px;border:1px solid #33495f;background:#0a1420;color:var(--text);font-size:20px;cursor:pointer}.qty-value{min-width:46px;text-align:center;font:24px Georgia,"Times New Roman",serif}.mint-side{display:grid;gap:18px;align-content:start}.mint-note{font-size:13px;color:var(--muted);line-height:1.7}.nft-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.nft-card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:13px;margin-bottom:16px}.nft-card .token{font-family:Georgia,"Times New Roman",serif;font-size:25px}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#bbc7d1}
    .genome-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.meter{height:10px;border:1px solid #293d52;border-radius:999px;background:#09131e;overflow:hidden;margin-top:12px}.meter span{display:block;height:100%;background:var(--lime)}.profile-word{font-family:Georgia,"Times New Roman",serif;font-size:30px}.compare-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}.vs{font:28px Georgia,"Times New Roman",serif;color:var(--lime)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.05);text-align:left}th{background:#0a1420;color:#a6b5c3}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:18px 0}.kpi .n{font:34px Georgia,"Times New Roman",serif}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
    .phasebox{position:fixed;right:14px;bottom:14px;z-index:80;width:300px;background:#09141f;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.phasehead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}.phasebody{padding:14px}.phasehelp{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}.footspace{height:24px}
    @media(max-width:1120px){.hero-grid,.status-grid,.mint-grid,.grid-4,.grid-3,.grid-2,.form-grid,.genome-grid{grid-template-columns:1fr 1fr}.nft-grid{grid-template-columns:repeat(2,1fr)}.kpi{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){:root{--wrap:min(100% - 28px,980px)}.header-inner{height:auto;padding:14px 0;flex-wrap:wrap}.nav{order:3;width:100%;margin-left:0;padding-bottom:8px;gap:16px}.hero-grid,.status-grid,.mint-grid,.grid-4,.grid-3,.grid-2,.form-grid,.genome-grid,.nft-grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}.compare-grid{grid-template-columns:1fr}.vs{text-align:center}.matrix{grid-template-columns:repeat(24,1fr)}h1{font-size:56px}.lead{font-size:17px}.phasebox{width:min(92vw,300px)}}
  </style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="brand"><span class="flame"></span><span>CANDLEKIN</span></div><nav class="nav" id="mainNav"></nav><div class="status-pill" id="topStatus"></div><button class="btn" id="headerCta"></button></div></header>
<main id="app"></main>
<div class="phasebox"><div class="phasehead" id="phaseToggle"><strong class="mono" style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)">Lifecycle // internal</strong><span>▾</span></div><div class="phasebody" id="phaseBody"><select id="phaseSelect"><option value="WHITELIST_OPEN">WHITELIST_OPEN</option><option value="WHITELIST_CLOSED">WHITELIST_CLOSED</option><option value="CHECKER_OPEN">CHECKER_OPEN</option><option value="GTD_MINT">GTD_MINT</option><option value="PUBLIC_MINT">PUBLIC_MINT</option><option value="SOLD_OUT">SOLD_OUT</option><option value="REVEALED">REVEALED</option><option value="CURATION_ADMIN">CURATION_ADMIN</option></select><div class="phasehelp" id="phaseHelp"></div></div></div>
<script>
const HERO_IMG='https://res.cloudinary.com/lqk65ybn/image/upload/v1788090258/ChatGPT_Image_Aug_24_2026_11_44_38_AM.png';
const phases={
WHITELIST_OPEN:{status:'Whitelist applications open',cta:'Open whitelist',help:'Home + Whitelist + Collection + FAQ. Mint and Market Lab are hidden.'},
WHITELIST_CLOSED:{status:'Whitelist review in progress',cta:'View whitelist',help:'Applications closed. Curation is internal. Public waits for checker.'},
CHECKER_OPEN:{status:'Allocation checker open',cta:'Check allocation',help:'Whitelist nav disappears. Checker becomes the main public action.'},
GTD_MINT:{status:'GTD mint live',cta:'Open mint',help:'GTD holders receive one guaranteed free mint. Public waits.'},
PUBLIC_MINT:{status:'Public mint live',cta:'Open mint',help:'Public mint at 0.0005 ETH. GTD phase has ended.'},
SOLD_OUT:{status:'Sold out // pre-reveal',cta:'View collection',help:'Mint is complete. My Candlekin remains sealed until reveal.'},
REVEALED:{status:'Reveal live',cta:'Open Market Lab',help:'Final art + traits + 12-bit Market Genome are public. Market Lab appears.'},
CURATION_ADMIN:{status:'Internal curation',cta:'Finalize list',help:'Internal-only applicant review. Final outcomes are GTD or PUBLIC.'}
};
const state={phase:'WHITELIST_OPEN',page:'home',answers:Array(6).fill(null),q:0,qty:1,walletConnected:false,owned:[1842,2291,3807],applicants:[
{id:'CK-01801',x:'@pixelmarc',wallet:'0xbbb...12df',signal:'0000 0000 0000',social:'PARTIAL',sybil:'MED',score:86,decision:''},
{id:'CK-01802',x:'@chainlena',wallet:'0xccc...7ad1',signal:'0001 0011 1101',social:'VERIFIED',sybil:'LOW',score:72,decision:''},
{id:'CK-01803',x:'@bulltape',wallet:'0xddd...8be1',signal:'0010 0111 1010',social:'VERIFIED',sybil:'LOW',score:91,decision:'GTD'},
{id:'CK-01804',x:'@0xsignal',wallet:'0xeee...e011',signal:'0011 1011 0111',social:'VERIFIED',sybil:'HIGH',score:41,decision:'PUBLIC'},
{id:'CK-01805',x:'@candleframe',wallet:'0xfff...aac1',signal:'0100 0110 1001',social:'VERIFIED',sybil:'LOW',score:77,decision:''}
]};
const qs=[
['When the market accelerates, what do you trust first?',['Momentum','Structure','Volume','Confirmation']],
['A signal appears before the crowd reacts. What is your instinct?',['Observe','Enter Early','Wait For Confirmation','Ignore The Noise']],
['Which market state feels most natural to read?',['Trending','Volatile','Compressed','Reversing']],
['When two signals conflict, what matters most?',['Patience','Conviction','Risk Control','Adaptability']],
['Which type of move catches your attention first?',['Breakout','Reversal','Acceleration','Range Expansion']],
['What defines a strong market signal to you?',['Timing','Clarity','Persistence','Alignment']]
];
const checkerDB={'0x1111111111111111111111111111111111111111':'GTD','0x2222222222222222222222222222222222222222':'PUBLIC','0x3333333333333333333333333333333333333333':'GTD'};
function genomeFor(id){const n=(id*2654435761>>>0)%4096;const b=n.toString(2).padStart(12,'0');const m=parseInt(b.slice(0,4),2),v=parseInt(b.slice(4,8),2),c=parseInt(b.slice(8),2);return{bits:b.slice(0,4)+' '+b.slice(4,8)+' '+b.slice(8),m,v,c,mp:Math.round(m/15*100),vp:Math.round(v/15*100),cp:Math.round(c/15*100)}}
function band(type,n){if(type==='m')return ['DORMANT','BUILDING','ACTIVE','SURGING'][Math.min(3,Math.floor(n/4))];if(type==='v')return ['STABLE','RESPONSIVE','VOLATILE','EXTREME'][Math.min(3,Math.floor(n/4))];return ['FLEXIBLE','MEASURED','FIRM','ABSOLUTE'][Math.min(3,Math.floor(n/4))]}
function safeSignal(){return state.answers.map(a=>a===null?'00':['00','01','10','11'][a]).join(' ')}
function availablePages(){
  if(state.phase==='WHITELIST_OPEN'||state.phase==='WHITELIST_CLOSED')return['home','whitelist','collection','faq'];
  if(state.phase==='CHECKER_OPEN')return['home','collection','faq'];
  if(state.phase==='GTD_MINT'||state.phase==='PUBLIC_MINT')return['home','mint','collection','faq'];
  if(state.phase==='SOLD_OUT')return['home','collection','faq'];
  if(state.phase==='REVEALED')return['home','collection','marketlab','faq'];
  return['admin'];
}
function renderNav(){const nav=document.getElementById('mainNav');const pages=availablePages();const labels={home:'Home',whitelist:'Whitelist',mint:'Mint',collection:'Collection',marketlab:'Market Lab',faq:'FAQ',admin:'Admin'};nav.innerHTML=pages.map(p=>`<button class="${state.page===p?'active':''}" onclick="setPage('${p}')">${labels[p]}</button>`).join('')}
function collectionOverview(){return `<section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Collection</div><h2>4,096 market states.</h2></div><div class="subtle">A fixed 2,048 Bullkin / 2,048 Bearkin split. Visual DNA and Market Genome remain separate identity layers.</div></div><div class="grid-4"><div class="card stat"><div class="label">Supply</div><div class="value">4,096</div><p>Hard-pixel collection.</p></div><div class="card stat"><div class="label">Bullkin</div><div class="value">2,048</div><p>Fixed family allocation.</p></div><div class="card stat"><div class="label">Bearkin</div><div class="value">2,048</div><p>Fixed family allocation.</p></div><div class="card stat"><div class="label">Genome</div><div class="value">12-bit</div><p>One unique state per NFT after reveal.</p></div></div></div></section>`}
function faq(){return `<section><div class="wrap"><div class="section-head"><div><div class="eyebrow">FAQ</div><h2>What matters.</h2></div></div><div class="grid-2"><div class="card"><h3>What is Genesis Signal?</h3><p>A 12-bit participant identity created during whitelist calibration. It does not decide rarity, traits, family, token ID, or Market Genome.</p></div><div class="card"><h3>What is GTD?</h3><p>A guaranteed allocation selected from the whitelist applicant pool. Current launch direction: one free mint for each GTD allocation.</p></div><div class="card"><h3>What is Public Mint?</h3><p>The open mint phase after GTD. Current planned price in this prototype is <strong>0.0005 ETH</strong> per NFT.</p></div><div class="card"><h3>What is Market Lab?</h3><p>A post-reveal identity explorer for Market Genome: decoder, profile, compare, share card, and Genome Atlas.</p></div></div></div></section>`}
function heroArt(caption2){return `<div class="art-box"><img src="${HERO_IMG}" alt="Candlekin sealed signal"><div class="caption"><span>Identity // sealed</span><span>${caption2}</span></div></div>`}
function home(){
  if(state.phase==='WHITELIST_OPEN')return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>Whitelist applications open</span><span class="chip">4,096 supply</span><span class="chip">Robinhood Chain</span></div><div class="eyebrow">Candlekin // whitelist season</div><h1>Register your signal.</h1><p class="lead">Candlekin begins with a whitelist campaign. Apply, generate a Genesis Signal, and enter review. Final applicant outcome is only GTD or Public.</p><div class="actions"><button class="btn" onclick="setPage('whitelist')">Open whitelist</button><button class="btn secondary" onclick="setPage('collection')">View collection</button></div></div>${heroArt('Whitelist campaign')}</div></section>${collectionOverview()}${faq()}`;
  if(state.phase==='WHITELIST_CLOSED')return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip">Whitelist closed</span><span class="chip">Review in progress</span></div><div class="eyebrow">Candlekin // curation</div><h1>Applications are under review.</h1><p class="lead">The applicant pool is locked. Candlekin is now preparing final GTD and Public outcomes before the checker opens.</p><div class="actions"><button class="btn secondary" onclick="setPage('whitelist')">View whitelist status</button><button class="btn ghost" onclick="setPage('collection')">View collection</button></div></div>${heroArt('Applications locked')}</div></section>${collectionOverview()}${faq()}`;
  if(state.phase==='CHECKER_OPEN')return checkerHome();
  if(state.phase==='GTD_MINT')return mintEraHome('GTD mint is live.','Guaranteed free mint is open for eligible wallets. Public mint has not started yet.');
  if(state.phase==='PUBLIC_MINT')return mintEraHome('Public mint is live.','GTD has ended. Remaining Candlekin can now be minted publicly at 0.0005 ETH.');
  if(state.phase==='SOLD_OUT')return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip">Sold out</span><span class="chip">Pre-reveal</span></div><div class="eyebrow">Candlekin // sealed</div><h1>4,096 / 4,096.</h1><p class="lead">Minting is complete. Every Candlekin remains sealed until Reveal. Holders can already see ownership inside Collection.</p><div class="actions"><button class="btn" onclick="setPage('collection')">Open My Candlekin</button></div></div>${heroArt('Sold out // pre-reveal')}</div></section>${collectionOverview()}${faq()}`;
  if(state.phase==='REVEALED')return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>Reveal live</span><span class="chip">Market Lab online</span></div><div class="eyebrow">Candlekin // revealed</div><h1>Every state is now visible.</h1><p class="lead">Final artwork, visual traits, and Market Genome are now public. Market Lab decodes the 12-bit identity behind every Candlekin.</p><div class="actions"><button class="btn" onclick="setPage('marketlab')">Open Market Lab</button><button class="btn secondary" onclick="setPage('collection')">My Candlekin</button></div></div>${heroArt('Reveal complete')}</div></section>${collectionOverview()}${faq()}`;
  return adminPage();
}
function whitelistPage(){
  if(state.phase==='WHITELIST_CLOSED')return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip">Whitelist closed</span><span class="chip">Under review</span></div><div class="eyebrow">Candlekin // whitelist</div><h1>Applications are closed.</h1><p class="lead">Submissions are being reviewed. The next public step is the allocation checker.</p><div class="actions"><button class="btn secondary" onclick="setPage('home')">Back home</button></div></div>${heroArt('Whitelist closed')}</div></section><section><div class="wrap grid-3"><div class="card"><h3>Submitted</h3><p>Your whitelist application stays locked in the applicant pool.</p></div><div class="card"><h3>Reviewed</h3><p>Internal curation ends with one of two outcomes: GTD or Public.</p></div><div class="card"><h3>Checker</h3><p>Final result becomes visible once the checker phase opens.</p></div></div></section>`;
  const q=qs[Math.min(state.q,5)];
  return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>Whitelist applications open</span><span class="chip">Genesis calibration</span></div><div class="eyebrow">Candlekin // whitelist</div><h1>Register your signal.</h1><p class="lead">Complete a short six-question calibration, generate your Genesis Signal, share it, then submit your whitelist application for review.</p></div>${heroArt('Whitelist application')}</div></section><section id="apply"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Application</div><h2>Whitelist entry.</h2></div><div class="subtle">Prototype only. Production submissions will later write to a real backend / Google Sheet workflow.</div></div><div class="status-grid"><div class="card"><div class="form-grid"><div><label>X username</label><input placeholder="@username"></div><div><label>EVM wallet</label><input placeholder="0x..."></div></div><div class="question"><label>Calibration question ${Math.min(state.q+1,6)} / 6</label><h3>${q[0]}</h3><div class="options">${q[1].map((o,i)=>`<button class="option ${state.answers[state.q]===i?'active':''}" onclick="pickAnswer(${state.q},${i})">${o}</button>`).join('')}</div></div><div class="actions"><button class="btn secondary" ${state.q===0?'disabled':''} onclick="prevQ()">Previous</button>${state.q<5?`<button class="btn" ${state.answers[state.q]===null?'disabled':''} onclick="nextQ()">Next</button>`:`<button class="btn" ${state.answers[5]===null?'disabled':''} onclick="showShare()">Generate share card</button>`}</div></div><div class="card"><div class="eyebrow">Genesis Signal</div><div class="bitline">${safeSignal()}</div><p style="margin-top:18px">Participant identity only. It does not affect NFT family, visual traits, rarity, mint result, or Market Genome.</p><div class="share-card" style="margin-top:18px;${state.q===6?'':'display:none'}"><div class="tiny">Candlekin</div><div class="big">Signal registered.</div><div class="tiny">Genesis Signal</div><div class="bitline" style="font-size:22px">${safeSignal()}</div><p style="margin-top:16px">My Candlekin signal is registered.<br>${safeSignal()}<br>@Candlekin</p></div><div style="${state.q===6?'':'display:none'}"><div style="height:18px"></div><label>Shared post URL</label><input placeholder="https://x.com/..."><div style="height:16px"></div><label>What makes Candlekin worth holding after Reveal?</label><textarea placeholder="Write your answer..."></textarea><div class="actions"><button class="btn ghost">Copy share text</button><button class="btn">Submit application</button></div></div></div></div></div></section>`
}
function signalMatrix(){const cells=Array.from({length:1024},(_,i)=>`<div class="cell ${(i%29===0||i%31===0)&&i<350?'lit':''}"></div>`).join('');return `<div class="card"><div class="eyebrow">Signal Matrix</div><h3 style="font-size:29px">4,096 token slots</h3><p>Compact public supply visualization. Production can use cached/indexed contract state instead of querying every token individually.</p><div class="matrix-shell"><div class="matrix">${cells}</div></div></div>`}
function checkerHome(){return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>Checker open</span><span class="chip">GTD / Public</span></div><div class="eyebrow">Candlekin // allocation</div><h1>Check your allocation.</h1><p class="lead">Whitelist curation is complete. Connect or enter your wallet to see the final result.</p><div class="actions"><button class="btn" onclick="document.getElementById('checker').scrollIntoView({behavior:'smooth'})">Open checker</button></div></div>${heroArt('Checker phase')}</div></section><section id="checker"><div class="wrap status-grid"><div class="card"><div class="eyebrow">Allocation checker</div><h2>Wallet status.</h2><p>Prototype examples: <span class="mono">0x1111...1111</span> returns GTD and <span class="mono">0x2222...2222</span> returns Public.</p><label>Wallet address</label><input id="checkerInput" placeholder="0x1111111111111111111111111111111111111111"><div class="actions"><button class="btn" onclick="runChecker()">Check status</button></div><div id="checkerResult" class="checker-result"></div></div>${signalMatrix()}</div></section>${collectionOverview()}${faq()}`}
function mintEraHome(title,desc){return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>${state.phase==='GTD_MINT'?'GTD mint live':'Public mint live'}</span><span class="chip">Candlekin mint</span></div><div class="eyebrow">Candlekin // mint era</div><h1>${title}</h1><p class="lead">${desc}</p><div class="actions"><button class="btn" onclick="setPage('mint')">Open mint</button><button class="btn secondary" onclick="setPage('collection')">My Candlekin</button></div></div>${heroArt(state.phase==='GTD_MINT'?'GTD mint':'Public mint')}</div></section>${collectionOverview()}${faq()}`}
function mintPage(){
  if(state.phase!=='GTD_MINT'&&state.phase!=='PUBLIC_MINT')return home();
  const gtd=state.phase==='GTD_MINT',progress=gtd?9:46;
  return `<section class="hero"><div class="wrap"><div class="chips"><span class="chip"><span class="dot"></span>${gtd?'GTD mint live':'Public mint live'}</span><span class="chip">Dedicated mint page</span></div><div class="eyebrow">Candlekin // mint</div><h1>${gtd?'GTD free mint.':'Public mint.'}</h1><p class="lead">${gtd?'Eligible GTD wallets have one guaranteed free mint. Public wallets wait until the next phase.':'Remaining supply is open to everyone at 0.0005 ETH per NFT.'}</p></div></section><section><div class="wrap mint-grid"><div class="card"><div class="eyebrow">Mint module</div><h2>${gtd?'Guaranteed allocation':'Public mint live'}</h2><p>${gtd?'Connect an eligible GTD wallet to claim its free allocation.':'Public mint is FCFS. Final wallet limit is still TBD.'}</p><div class="list"><div class="list-row"><span>Phase</span><strong>${gtd?'GTD':'PUBLIC'}</strong></div><div class="list-row"><span>Price</span><strong>${gtd?'0 ETH':'0.0005 ETH'}</strong></div><div class="list-row"><span>Supply</span><strong>${gtd?'372 / 4,096':'1,884 / 4,096'}</strong></div><div class="list-row"><span>Allocation</span><strong>${gtd?'1 guaranteed':'FCFS'}</strong></div></div><div style="height:20px"></div>${gtd?'':`<label>Quantity</label><div class="qty"><button onclick="changeQty(-1)">−</button><div class="qty-value">${state.qty}</div><button onclick="changeQty(1)">+</button></div><div style="height:18px"></div>`}<button class="btn">${gtd?'Mint GTD Candlekin':'Mint Candlekin'}</button><div class="mint-note" style="margin-top:14px">Prototype UI only. Contract wiring and final wallet limits are not implemented here.</div></div><div class="mint-side"><div class="hero-art"><img src="${HERO_IMG}" alt="Candlekin pre-reveal"><div class="caption"><span>Identity // sealed</span><span>Pre-reveal mint art</span></div></div><div class="card"><div class="eyebrow">Supply progress</div><h3>${progress}% minted</h3><div class="supply-meter"><span style="width:${progress}%"></span></div><p style="margin-top:14px">Only the public progress state belongs here. Final art remains hidden until reveal.</p></div><div class="card"><div class="eyebrow">Reveal policy</div><div class="list"><div class="list-row"><span>Minted NFT</span><strong>Owned immediately</strong></div><div class="list-row"><span>Artwork</span><strong>Sealed</strong></div><div class="list-row"><span>Market Genome</span><strong>Hidden</strong></div></div></div></div></div></section>`
}
function collectionPage(){
  const revealed=state.phase==='REVEALED';
  if(!state.walletConnected)return `<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Collection // My Candlekin</div><h1>View your Candlekin.</h1><p class="lead">Collection is personal by design. Connect a wallet to load only the Candlekin owned by that wallet instead of rendering all 4,096 tokens.</p><div class="actions"><button class="btn" onclick="connectWallet()">Connect wallet</button></div></div>${heroArt(revealed?'Revealed collection':'Sealed collection')}</div></section><section><div class="wrap grid-3"><div class="card"><h3>Lightweight</h3><p>Only owned token IDs and their metadata need to be loaded.</p></div><div class="card"><h3>Before reveal</h3><p>Owned NFTs show token ID and sealed artwork.</p></div><div class="card"><h3>After reveal</h3><p>Final art, traits and Market Genome become visible.</p></div></div></section>`;
  return `<section class="hero"><div class="wrap"><div class="chips"><span class="chip"><span class="dot"></span>Wallet connected</span><span class="chip">3 Candlekin found</span></div><div class="eyebrow">Collection // My Candlekin</div><h1>Your collection.</h1><p class="lead">Only NFTs owned by the connected wallet are displayed here.</p><div class="actions"><button class="btn secondary" onclick="disconnectWallet()">Disconnect</button></div></div></section><section><div class="wrap"><div class="nft-grid">${state.owned.map(id=>{const g=genomeFor(id);return `<div class="card nft-card"><img src="${HERO_IMG}" alt="Candlekin #${id}"><div class="token">Candlekin #${String(id).padStart(4,'0')}</div><div style="margin:10px 0"><span class="pill">${revealed?'Revealed':'Sealed'}</span></div>${revealed?`<div class="list"><div class="list-row"><span>Family</span><strong>${id%2?'Bullkin':'Bearkin'}</strong></div><div class="list-row"><span>Market Genome</span><strong class="mono">${g.bits}</strong></div></div><div class="actions"><button class="btn small" onclick="openGenome(${id})">Open in Market Lab</button></div>`:`<p>Final family, traits, and Market Genome remain hidden until reveal.</p>`}</div>`}).join('')}</div></div></section>`
}
function marketLab(){
  if(state.phase!=='REVEALED')return home();
  const id=state.labId||1842,g=genomeFor(id),g2=genomeFor(912);
  return `<section class="hero"><div class="wrap hero-grid"><div><div class="chips"><span class="chip"><span class="dot"></span>Market Lab online</span><span class="chip">Post-reveal</span></div><div class="eyebrow">Candlekin // Market Lab</div><h1>Decode the state.</h1><p class="lead">Market Lab interprets the permanent 12-bit Market Genome behind every revealed Candlekin.</p><div class="actions"><input id="labSearch" style="max-width:230px" value="${id}" placeholder="Token ID"><button class="btn" onclick="searchGenome()">Decode</button></div></div><div class="card"><div class="eyebrow">Selected token</div><img src="${HERO_IMG}" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;margin-bottom:18px" alt="Candlekin #${id}"><h3>Candlekin #${String(id).padStart(4,'0')}</h3><div class="bitline" style="font-size:22px">${g.bits}</div></div></div></section><section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Genome Decoder</div><h2>MMMM VVVV CCCC</h2></div><div class="subtle">4 bits Momentum × 4 bits Volatility × 4 bits Conviction = 4,096 possible genome states.</div></div><div class="genome-grid"><div class="card"><div class="eyebrow">Momentum</div><div class="stat"><div class="value">${g.mp}%</div></div><div class="profile-word">${band('m',g.m)}</div><div class="meter"><span style="width:${g.mp}%"></span></div><p style="margin-top:14px">${g.m} / 15</p></div><div class="card"><div class="eyebrow">Volatility</div><div class="stat"><div class="value">${g.vp}%</div></div><div class="profile-word">${band('v',g.v)}</div><div class="meter"><span style="width:${g.vp}%"></span></div><p style="margin-top:14px">${g.v} / 15</p></div><div class="card"><div class="eyebrow">Conviction</div><div class="stat"><div class="value">${g.cp}%</div></div><div class="profile-word">${band('c',g.c)}</div><div class="meter"><span style="width:${g.cp}%"></span></div><p style="margin-top:14px">${g.c} / 15</p></div></div></div></section><section><div class="wrap grid-2"><div class="card"><div class="eyebrow">Market Profile</div><h2 style="font-size:38px">${band('m',g.m)} / ${band('v',g.v)} / ${band('c',g.c)}</h2><p>This profile is generated compositionally from the three genome axes, keeping the system deterministic and easy to understand.</p><div class="actions"><button class="btn">Generate Share Card</button></div></div><div class="card"><div class="eyebrow">Genome Anatomy</div><div class="bitline">${g.bits}</div><div class="list" style="margin-top:18px"><div class="list-row"><span>Bits 01–04</span><strong>Momentum</strong></div><div class="list-row"><span>Bits 05–08</span><strong>Volatility</strong></div><div class="list-row"><span>Bits 09–12</span><strong>Conviction</strong></div></div></div></div></section><section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Compare</div><h2>Two genomes, side by side.</h2></div></div><div class="card compare-grid"><div><div class="eyebrow">Candlekin #${String(id).padStart(4,'0')}</div><div class="bitline" style="font-size:20px">${g.bits}</div><p>${g.mp}% Momentum · ${g.vp}% Volatility · ${g.cp}% Conviction</p></div><div class="vs">VS</div><div><div class="eyebrow">Candlekin #0912</div><div class="bitline" style="font-size:20px">${g2.bits}</div><p>${g2.mp}% Momentum · ${g2.vp}% Volatility · ${g2.cp}% Conviction</p></div></div></div></section><section><div class="wrap"><div class="section-head"><div><div class="eyebrow">Genome Atlas</div><h2>4,096 possible states.</h2></div><div class="subtle">The atlas is mathematical, not a 4,096-item RPC gallery. Your selected genome can be highlighted without loading every NFT.</div></div>${genomeAtlas(g)}</div></section>`
}
function genomeAtlas(g){const target=parseInt(g.bits.replace(/ /g,''),2);let cells='';for(let i=0;i<1024;i++){const global=Math.floor(i*4);cells+=`<div class="cell ${Math.abs(global-target)<4?'mine':(i%37===0?'lit':'')}"></div>`}return `<div class="matrix-shell"><div class="matrix">${cells}</div></div>`}
function adminPage(){const gtd=state.applicants.filter(a=>a.decision==='GTD').length,pub=state.applicants.filter(a=>a.decision==='PUBLIC').length,pending=state.applicants.length-gtd-pub,flagged=state.applicants.filter(a=>a.sybil==='HIGH').length;return `<section class="hero"><div class="wrap"><div class="eyebrow">Internal only</div><h2>Whitelist curation.</h2><p class="lead">Keep operations simple: review applicants, assign GTD or Public, then finalize the list.</p><div class="kpi"><div class="card"><div class="tiny">Applicants</div><div class="n">${state.applicants.length}</div></div><div class="card"><div class="tiny">Pending</div><div class="n">${pending}</div></div><div class="card"><div class="tiny">GTD</div><div class="n">${gtd}</div></div><div class="card"><div class="tiny">Public</div><div class="n">${pub}</div></div><div class="card"><div class="tiny">Flagged</div><div class="n">${flagged}</div></div></div><div class="toolbar"><input style="max-width:230px" placeholder="Search X / wallet"><select style="max-width:180px"><option>All</option><option>Pending</option><option>GTD</option><option>Public</option><option>Flagged</option></select><button class="btn secondary">Export CSV</button><button class="btn">Finalize GTD list</button></div><div class="table-wrap"><table><thead><tr><th>Application</th><th>X</th><th>Wallet</th><th>Genesis</th><th>Social</th><th>Sybil</th><th>Score</th><th>Decision</th></tr></thead><tbody>${state.applicants.map((a,i)=>`<tr><td>${a.id}</td><td>${a.x}</td><td>${a.wallet}</td><td style="color:var(--lime)">${a.signal}</td><td class="${a.social==='VERIFIED'?'good':'warn'}">${a.social}</td><td class="${a.sybil==='LOW'?'good':a.sybil==='MED'?'warn':'bad'}">${a.sybil}</td><td>${a.score}</td><td><div style="display:flex;gap:8px"><button class="btn small ${a.decision==='GTD'?'':'secondary'}" onclick="setDecision(${i},'GTD')">GTD</button><button class="btn small ${a.decision==='PUBLIC'?'':'secondary'}" onclick="setDecision(${i},'PUBLIC')">Public</button></div></td></tr>`).join('')}</tbody></table></div></div></section>`}
function pageHtml(){if(state.phase==='CURATION_ADMIN')return adminPage();if(state.page==='whitelist')return whitelistPage();if(state.page==='mint')return mintPage();if(state.page==='collection')return collectionPage();if(state.page==='marketlab')return marketLab();if(state.page==='faq')return faq();return home()}
function render(){const meta=phases[state.phase];document.getElementById('topStatus').textContent=meta.status;document.getElementById('headerCta').textContent=meta.cta;document.getElementById('phaseHelp').textContent=meta.help;document.getElementById('phaseSelect').value=state.phase;const allowed=availablePages();if(!allowed.includes(state.page))state.page=allowed[0];renderNav();document.getElementById('app').innerHTML=pageHtml()+'<div class="footspace"></div>'}
function setPage(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function pickAnswer(q,i){state.answers[q]=i;render()}function nextQ(){if(state.q<5&&state.answers[state.q]!==null){state.q++;render()}}function prevQ(){if(state.q>0){state.q--;render()}}function showShare(){if(state.answers[5]!==null){state.q=6;render()}}function changeQty(d){state.qty=Math.max(1,Math.min(3,state.qty+d));render()}function connectWallet(){state.walletConnected=true;render()}function disconnectWallet(){state.walletConnected=false;render()}function openGenome(id){state.labId=id;state.page='marketlab';render();window.scrollTo({top:0,behavior:'smooth'})}function searchGenome(){const v=parseInt(document.getElementById('labSearch')?.value||'1842',10);state.labId=Math.max(1,Math.min(4096,isNaN(v)?1842:v));render()}function setDecision(i,v){state.applicants[i].decision=v;render()}
function runChecker(){const v=(document.getElementById('checkerInput')?.value||'').trim().toLowerCase(),box=document.getElementById('checkerResult');if(!box)return;box.classList.add('active');if(!/^0x[a-f0-9]{40}$/.test(v)){box.innerHTML=`<div class="card"><div class="result-badge public">Invalid wallet</div><p style="margin-top:12px">Enter a valid EVM wallet address.</p></div>`;return}const r=checkerDB[v]||'PUBLIC';box.innerHTML=r==='GTD'?`<div class="card"><div class="result-badge gtd">GTD</div><h3 style="margin-top:12px">Guaranteed allocation confirmed.</h3><div class="list"><div class="list-row"><span>Allocation</span><strong>1</strong></div><div class="list-row"><span>Price</span><strong>0 ETH</strong></div><div class="list-row"><span>Next phase</span><strong>GTD Mint</strong></div></div></div>`:`<div class="card"><div class="result-badge public">Public</div><h3 style="margin-top:12px">Public access.</h3><div class="list"><div class="list-row"><span>Guaranteed allocation</span><strong>None</strong></div><div class="list-row"><span>Public price</span><strong>0.0005 ETH</strong></div><div class="list-row"><span>Next phase</span><strong>Public Mint</strong></div></div></div>`}
document.getElementById('phaseSelect').addEventListener('change',e=>{state.phase=e.target.value;state.page=availablePages()[0];render()});document.getElementById('phaseToggle').addEventListener('click',()=>document.getElementById('phaseBody').classList.toggle('hidden'));document.getElementById('headerCta').addEventListener('click',()=>{if(state.phase==='WHITELIST_OPEN'){setPage('whitelist')}else if(state.phase==='WHITELIST_CLOSED'){setPage('whitelist')}else if(state.phase==='CHECKER_OPEN'){setPage('home');setTimeout(()=>document.getElementById('checker')?.scrollIntoView({behavior:'smooth'}),50)}else if(state.phase==='GTD_MINT'||state.phase==='PUBLIC_MINT'){setPage('mint')}else if(state.phase==='SOLD_OUT'){setPage('collection')}else if(state.phase==='REVEALED'){setPage('marketlab')}else{state.page='admin';render()}});
render();
window.setPage=setPage;window.pickAnswer=pickAnswer;window.nextQ=nextQ;window.prevQ=prevQ;window.showShare=showShare;window.changeQty=changeQty;window.connectWallet=connectWallet;window.disconnectWallet=disconnectWallet;window.openGenome=openGenome;window.searchGenome=searchGenome;window.setDecision=setDecision;window.runChecker=runChecker;
</script>
</body>
</html>
