<script>
const HERO_IMG='https://res.cloudinary.com/lqk65ybn/image/upload/v1788090258/ChatGPT_Image_Aug_24_2026_11_44_38_AM.png';
const SHARE_IMG='https://res.cloudinary.com/lqk65ybn/image/upload/v1788520552/sharecard.png';
const OPENSEA_DROP_URL=''; // add final OpenSea drop URL when available
const phases=['WHITELIST_OPEN','WHITELIST_CLOSED','CURATION_ADMIN','CHECKER_OPEN','GTD_MINT','FCFS_MINT','PUBLIC_MINT','SOLD_OUT','REVEALED'];
const phaseCopy={
 WHITELIST_OPEN:'Applications are open. Final whitelist outcomes: GTD or FCFS. Public is a separate open mint stage.',
 WHITELIST_CLOSED:'Applications are locked. Curation is preparing GTD and FCFS lists.',
 CURATION_ADMIN:'Internal curation preview. Assign GTD, FCFS, or Not Selected.',
 CHECKER_OPEN:'Checker reveals GTD or FCFS eligibility. Non-selected wallets can still join Public later.',
 GTD_MINT:'OpenSea presale stage 1. GTD wallets have guaranteed allocation within the stage rules.',
 FCFS_MINT:'OpenSea presale stage 2. FCFS wallets are eligible but supply is not guaranteed.',
 PUBLIC_MINT:'OpenSea public stage. Open to everyone; no whitelist required.',
 SOLD_OUT:'Mint complete. Ownership exists while final identity remains sealed.',
 REVEALED:'Final art and Market Genome are visible. Market Lab is online.'
};
const state={phase:'WHITELIST_OPEN',page:'home',answers:Array(6).fill(null),q:0,form:{x:'',wallet:'',sharedUrl:'',response:''},submitted:false,copyStatus:'Copy caption',walletConnected:false,owned:[1842,2291,3807],applicants:[
{id:'CK-1801',x:'@pixelmarc',wallet:'0xbbb...12df',signal:'0000 0000 0000',decision:'GTD'},
{id:'CK-1802',x:'@chainlena',wallet:'0xccc...7ad1',signal:'0001 0011 1101',decision:'FCFS'},
{id:'CK-1803',x:'@bulltape',wallet:'0xddd...8be1',signal:'0010 0111 1010',decision:''},
{id:'CK-1804',x:'@0xsignal',wallet:'0xeee...e011',signal:'0011 1011 0111',decision:'FCFS'}]};
const qs=[
['When the market accelerates, what do you trust first?',['Momentum','Structure','Volume','Confirmation']],
['A signal appears before the crowd reacts. What is your instinct?',['Observe','Enter Early','Wait For Confirmation','Ignore The Noise']],
['Which market state feels most natural to read?',['Trending','Volatile','Compressed','Reversing']],
['When two signals conflict, what matters most?',['Patience','Conviction','Risk Control','Adaptability']],
['Which type of move catches your attention first?',['Breakout','Reversal','Acceleration','Range Expansion']],
['What defines a strong market signal to you?',['Timing','Clarity','Persistence','Alignment']]
];
const checkerDB={
'0x1111111111111111111111111111111111111111':'GTD',
'0x2222222222222222222222222222222222222222':'FCFS'
};
function safeSignal(){const pairs=state.answers.map(a=>a===null?'00':['00','01','10','11'][a]).join('');return pairs.replace(/(.{4})(.{4})(.{4})/,'$1 $2 $3')}
function shareCaption(){return `Signal registered.\n\n${safeSignal()}\n\n@Candlekin // Genesis`}
function availablePages(){if(state.phase==='CURATION_ADMIN')return['admin'];if(state.phase==='WHITELIST_OPEN'||state.phase==='WHITELIST_CLOSED')return['home','whitelist','collection','faq'];if(state.phase==='CHECKER_OPEN')return['home','checker','collection','faq'];if(['GTD_MINT','FCFS_MINT','PUBLIC_MINT'].includes(state.phase))return['home','mint','collection','faq'];if(state.phase==='SOLD_OUT')return['home','collection','faq'];if(state.phase==='REVEALED')return['home','collection','marketlab','faq'];return['home']}
function renderNav(){const names={home:'Home',whitelist:'Whitelist',checker:'Checker',mint:'OpenSea Mint',collection:'Collection',marketlab:'Market Lab',faq:'FAQ',admin:'Curation'};nav.innerHTML=availablePages().map(p=>`<button class="${state.page===p?'active':''}" onclick="setPage('${p}')">${names[p]}</button>`).join('')}
function setPage(p){if(!availablePages().includes(p))return;state.page=p;render();scrollTo({top:0,behavior:'smooth'})}
function stageLabel(){return state.phase.replaceAll('_',' ')}
function hero(){let title='Register your<br><span class="outline">signal.</span>',copy='<strong>Whitelist is open.</strong> Apply once. Curated wallets are assigned GTD or FCFS. Public mint happens later as a separate OpenSea stage.';let cta=`<button class="btn primary" onclick="setPage('whitelist')">Open whitelist →</button>`;
if(state.phase==='WHITELIST_CLOSED'){title='Signal intake<br><span class="outline">closed.</span>';copy='<strong>Applications are locked.</strong> Curation is separating GTD and FCFS wallets before the checker opens.';cta=''}
if(state.phase==='CHECKER_OPEN'){title='Find your<br><span class="outline">tier.</span>';copy='<strong>GTD or FCFS.</strong> If you were not selected for presale, Public still opens later to everyone.';cta=`<button class="btn primary" onclick="setPage('checker')">Check wallet →</button>`}
if(state.phase==='GTD_MINT'){title='GTD is<br><span class="outline">live.</span>';copy='<strong>OpenSea presale #1.</strong> Guaranteed wallets mint during the GTD window under the final stage allocation rules.';cta=`<button class="btn primary" onclick="setPage('mint')">Open mint info →</button>`}
if(state.phase==='FCFS_MINT'){title='FCFS is<br><span class="outline">live.</span>';copy='<strong>OpenSea presale #2.</strong> Allowlisted FCFS wallets can mint while supply remains. Eligibility is not a guarantee.';cta=`<button class="btn primary" onclick="setPage('mint')">Open mint info →</button>`}
if(state.phase==='PUBLIC_MINT'){title='Public is<br><span class="outline">live.</span>';copy='<strong>No allowlist required.</strong> The final OpenSea stage is open to everyone while supply remains.';cta=`<button class="btn primary" onclick="setPage('mint')">Open mint info →</button>`}
if(state.phase==='SOLD_OUT'){title='All 4,096<br><span class="outline">sealed.</span>';copy='<strong>Mint complete.</strong> Tokens are owned, but final art and Market Genome remain hidden until Reveal.';cta=`<button class="btn primary" onclick="setPage('collection')">My Candlekin →</button>`}
if(state.phase==='REVEALED'){title='Identity<br><span class="outline">unsealed.</span>';copy='<strong>Reveal is live.</strong> Final art, traits and 12-bit Market Genome are now visible.';cta=`<button class="btn primary" onclick="setPage('marketlab')">Decode →</button>`}
return `<section class="hero"><div class="wrap hero-grid"><div><div class="kicker">Candlekin // ${stageLabel()}</div><h1 class="display">${title}</h1><p class="hero-copy">${copy}</p><div class="btnrow">${cta}<button class="btn text" onclick="setPage('collection')">Collection</button></div></div><div class="artframe"><img src="${HERO_IMG}" alt="Candlekin sealed identity artwork"><div class="artnote"><span>identity / sealed</span><span>4096 / fixed supply</span></div></div></div></section>`}
function overview(){return `<section class="section"><div class="wrap"><div class="section-head"><div><div class="section-no">01 / COLLECTION</div><h2>Hard pixel.<br>Hard rules.</h2></div><div class="section-intro">Candlekin is a fixed collection of <strong>4,096 market-state characters</strong>. Visual DNA controls appearance. Market Genome becomes the permanent post-Reveal identity. Whitelist answers never determine the NFT you receive.</div></div><div class="stats"><div class="stat"><small>Supply</small><b>4,096</b><em>fixed</em></div><div class="stat"><small>Bullkin</small><b>2,048</b><em>50%</em></div><div class="stat"><small>Bearkin</small><b>2,048</b><em>50%</em></div><div class="stat"><small>Genome</small><b>12-bit</b><em>post reveal</em></div></div></div></section>`}
function launchTrack(){const act=state.phase;return `<section class="section"><div class="wrap"><div class="section-head"><div><div class="section-no">02 / OPENSea DROP</div><h2>Three mint<br>stages.</h2></div><div class="section-intro">Whitelist curation produces only <strong>GTD or FCFS</strong>. Public is not a whitelist result — it is the final OpenSea stage, open to everyone.</div></div><div class="stage-track"><div class="stage ${act==='GTD_MINT'?'active':''}" data-n="01"><div class="stage-tag">Presale / Allowlist</div><h3>GTD</h3><p>Selected whitelist wallets. Guaranteed allocation during the GTD window, subject to the final per-wallet rule.</p><div class="rule">CURRENT // 1 guaranteed mint · price direction: free</div></div><div class="stage ${act==='FCFS_MINT'?'active':''}" data-n="02"><div class="stage-tag">Presale / Allowlist</div><h3>FCFS</h3><p>Selected whitelist wallets. Early access after GTD, but supply is first-come-first-served and not guaranteed.</p><div class="rule">PRICE + WALLET LIMIT // TBD</div></div><div class="stage ${act==='PUBLIC_MINT'?'active':''}" data-n="03"><div class="stage-tag">Public / No allowlist</div><h3>Public</h3><p>Final OpenSea stage. Anyone can mint while remaining supply lasts. No whitelist application is required.</p><div class="rule">CURRENT PRICE DIRECTION // 0.0005 ETH</div></div></div></div></section>`}
function whitelistPage(){if(state.phase==='WHITELIST_CLOSED')return `${hero()}<section class="section"><div class="wrap"><div class="section-head"><div><div class="section-no">WL / CLOSED</div><h2>Review in<br>progress.</h2></div><div class="section-intro">No new application can be submitted. Existing entries are being curated into <strong>GTD</strong>, <strong>FCFS</strong>, or not selected for presale.</div></div></div></section>`;
const all=state.answers.every(a=>a!==null),done=state.q>=6&&all,q=qs[Math.min(state.q,5)];return `${hero()}<section class="section"><div class="wrap"><div class="section-head"><div><div class="section-no">WL / APPLICATION</div><h2>One wallet.<br>One signal.</h2></div><div class="section-intro">Six calibration questions create a 12-bit Genesis Signal. It is participant identity only. <strong>It does not influence GTD/FCFS selection or NFT outcome.</strong></div></div><div class="split"><div class="panel"><div class="panel-title"><strong>Application</strong><span class="stage-tag">01—06</span></div><div class="fields"><div><label class="label">X username</label><input value="${esc(state.form.x)}" oninput="field('x',this.value)" placeholder="@username"></div><div><label class="label">EVM wallet</label><input value="${esc(state.form.wallet)}" oninput="field('wallet',this.value)" placeholder="0x..."></div></div><div class="question"><div class="question-count">QUESTION ${Math.min(state.q+1,6)} / 6</div><h3>${q[0]}</h3><div class="options">${q[1].map((o,i)=>`<button class="option ${state.answers[state.q]===i?'active':''}" onclick="pick(${state.q},${i})">${o}</button>`).join('')}</div><div class="btnrow"><button class="btn text" ${state.q===0?'disabled':''} onclick="prevQ()">← Previous</button>${state.q<5?`<button class="btn primary" ${state.answers[state.q]===null?'disabled':''} onclick="nextQ()">Next →</button>`:`<button class="btn primary" ${state.answers[5]===null?'disabled':''} onclick="finishSignal()">Generate signal →</button>`}</div></div></div><div class="panel"><div class="panel-title"><strong>Genesis Signal</strong><span class="stage-tag">participant ID</span></div><div class="signal">${safeSignal()}</div><div class="signal-note">No rarity logic. No family logic. No Market Genome logic. The signal belongs to the applicant, not the NFT.</div>${done?shareBlock():`<div style="height:160px;display:flex;align-items:end;color:#526670;font:11px 'Courier New',monospace">COMPLETE ALL 6 QUESTIONS TO REGISTER SIGNAL.</div>`}</div></div></div></section>`}
function shareBlock(){return `<div class="share-card"><img src="${SHARE_IMG}" alt="Candlekin Genesis share card"><div class="caption-preview"><span class="label">X caption / personalized</span><pre>${esc(shareCaption())}</pre></div><div class="share-actions"><button class="btn primary" onclick="shareX()">Share on X →</button><button class="btn" onclick="copyCaption()">${state.copyStatus}</button><button class="btn text" onclick="copyImage()">Copy image</button></div><div class="share-help">The artwork stays universal and lightweight. Only the caption changes with your Genesis Signal. On supported devices, Share on X uses the native share sheet with the image file attached; desktop fallback copies the image and opens the X composer.</div><div class="response-zone"><label class="label">Shared post URL</label><input value="${esc(state.form.sharedUrl)}" oninput="field('sharedUrl',this.value)" placeholder="https://x.com/..."><div style="height:20px"></div><label class="label">What makes Candlekin worth holding after Reveal?</label><textarea oninput="field('response',this.value)" placeholder="Write it like a human, not a pitch deck...">${esc(state.form.response)}</textarea><div class="btnrow"><button class="btn primary" onclick="submitApplication()">Submit preview →</button></div>${state.submitted?`<div class="success-line">APPLICATION VALIDATED LOCALLY // backend still disabled in preview</div>`:''}</div></div>`}
function checkerPage(){return `${hero()}<section class="section"><div class="wrap checker"><div class="section-no">CHECKER / PRESALE STATUS</div><h2>Wallet in.<br>Tier out.</h2><p class="section-intro" style="justify-self:start;margin:18px 0 34px">Demo addresses: 0x1111…1111 = GTD · 0x2222…2222 = FCFS. Any other valid wallet = not selected for presale, but Public remains available later.</p><label class="label">Wallet address</label><input id="checkerInput" placeholder="0x1111111111111111111111111111111111111111"><div class="btnrow"><button class="btn primary" onclick="checkWallet()">Check →</button></div><div id="checkerResult"></div></div></section>`}
function mintPage(){const info={GTD_MINT:{name:'GTD',kind:'OpenSea Presale 01',copy:'Guaranteed allowlist window for selected GTD wallets.',price:'0 ETH / current direction',limit:'1 guaranteed / current direction'},FCFS_MINT:{name:'FCFS',kind:'OpenSea Presale 02',copy:'Allowlisted FCFS window. Eligible does not mean guaranteed; remaining supply is first-come-first-served.',price:'TBD',limit:'TBD'},PUBLIC_MINT:{name:'PUBLIC',kind:'OpenSea Public Stage',copy:'No allowlist required. Anyone can mint while remaining supply lasts.',price:'0.0005 ETH / current direction',limit:'TBD'}}[state.phase];if(!info)return hero();return `${hero()}<section class="section"><div class="wrap"><div class="mint-callout"><div><div class="section-no">MINT / ${info.kind.toUpperCase()}</div><h3>${info.name}<br>on OpenSea.</h3><p>${info.copy} Candlekin.com is the project site; the actual mint transaction is intended to happen on the OpenSea Drop page.</p><div class="stage-meta"><div class="meta-unit"><small>Price</small><b>${info.price}</b></div><div class="meta-unit"><small>Wallet rule</small><b>${info.limit}</b></div><div class="meta-unit"><small>Venue</small><b>OpenSea</b></div></div></div><div>${OPENSEA_DROP_URL?`<a class="btn primary" href="${OPENSEA_DROP_URL}" target="_blank" rel="noopener">Mint on OpenSea →</a>`:`<button class="btn primary" disabled>OpenSea URL pending</button>`}</div></div></div></section>${launchTrack()}`}
function collectionPage(){if(!state.walletConnected)return `${hero()}<section class="section"><div class="wrap"><div class="section-head"><div><div class="section-no">MY CANDLEKIN</div><h2>Your tokens.<br>Not 4,096 calls.</h2></div><div class="section-intro">The production Collection view will focus on the connected wallet’s Candlekin instead of loading every token through raw RPC. This button is still a local UI simulation.</div></div><button class="btn primary" onclick="connectWallet()">Preview wallet state →</button></div></section>`;return `${hero()}<section class="section"><div class="wrap"><div class="section-head"><div><div class="section-no">MY CANDLEKIN / DEMO</div><h2>Three owned.</h2></div><div class="section-intro">Demo ownership only. Before Reveal every token uses sealed art; after Reveal this view exposes family, traits and Market Genome.</div></div><div class="collection-grid">${state.owned.map(id=>`<article class="nft"><img src="${HERO_IMG}" alt="Candlekin #${id}"><h3>#${String(id).padStart(4,'0')}</h3><p>${state.phase==='REVEALED'?'REVEALED // GENOME DEMO':'IDENTITY // SEALED'}</p></article>`).join('')}</div><div class="btnrow"><button class="btn text" onclick="disconnectWallet()">Disconnect preview</button></div></div></section>`}
function marketLab(){return `${hero()}<section class="section"><div class="wrap"><div class="section-head"><div><div class="section-no">MARKET LAB / PREVIEW</div><h2>Decode,<br>don’t predict.</h2></div><div class="section-intro">Market Lab is the post-Reveal identity layer. The current 12-bit structure remains under decision lock; this page deliberately avoids presenting demo math as final production truth.</div></div><div class="stats"><div class="stat"><small>Momentum</small><b>4 bit</b><em>current</em></div><div class="stat"><small>Volatility</small><b>4 bit</b><em>current</em></div><div class="stat"><small>Conviction</small><b>4 bit</b><em>current</em></div><div class="stat"><small>States</small><b>4,096</b><em>1 / nft target</em></div></div></div></section>`}
function faqPage(){return `<section class="section"><div class="wrap"><div class="section-head"><div><div class="section-no">FAQ / SHORT VERSION</div><h2>No pitch-deck<br>answers.</h2></div><div class="section-intro">Only the rules collectors actually need during whitelist and mint.</div></div><div class="faq"><div class="faq-item"><h3>Does Genesis Signal choose my NFT?</h3><p>No. It is participant identity only. It does not determine family, rarity, Visual DNA, token ID or Market Genome.</p></div><div class="faq-item"><h3>What can I get from whitelist?</h3><p>GTD or FCFS. GTD is guaranteed presale allocation; FCFS is presale eligibility without a guarantee.</p></div><div class="faq-item"><h3>What if I am not selected?</h3><p>You can still mint during Public if supply remains. Public is a separate OpenSea stage and requires no allowlist.</p></div><div class="faq-item"><h3>Where do I mint?</h3><p>OpenSea. This website handles project identity, whitelist, checker, Collection and Market Lab; the primary mint transaction is intended to happen on the OpenSea Drop page.</p></div></div></div></section>`}
function adminPage(){return `<section class="section"><div class="wrap"><div class="section-head"><div><div class="section-no">INTERNAL / CURATION</div><h2>Two lists.<br>No Public tier.</h2></div><div class="section-intro">Whitelist decisions are GTD, FCFS, or not selected. GTD and FCFS should remain mutually exclusive before exporting OpenSea allowlists.</div></div><div style="overflow:auto"><table class="admin-table"><thead><tr><th>ID</th><th>X</th><th>Wallet</th><th>Genesis</th><th>Decision</th></tr></thead><tbody>${state.applicants.map((a,i)=>`<tr><td>${a.id}</td><td>${a.x}</td><td>${a.wallet}</td><td style="color:var(--lime)">${a.signal}</td><td><div class="admin-actions"><button class="${a.decision==='GTD'?'on':''}" onclick="decision(${i},'GTD')">GTD</button><button class="${a.decision==='FCFS'?'on':''}" onclick="decision(${i},'FCFS')">FCFS</button><button class="${a.decision===''?'on':''}" onclick="decision(${i},'')">NONE</button></div></td></tr>`).join('')}</tbody></table></div></div></section>`}
function home(){return `${hero()}${overview()}${launchTrack()}${faqPage()}`}
function pageHtml(){if(state.page==='whitelist')return whitelistPage();if(state.page==='checker')return checkerPage();if(state.page==='mint')return mintPage();if(state.page==='collection')return collectionPage();if(state.page==='marketlab')return marketLab();if(state.page==='faq')return faqPage();if(state.page==='admin')return adminPage();return home()}
function render(){if(!availablePages().includes(state.page))state.page=availablePages()[0];renderNav();document.getElementById('ticker').textContent=`${stageLabel()} // GTD + FCFS PRESALE // PUBLIC SEPARATE // MINT ON OPENSEA // 4,096 CANDLEKIN`;document.getElementById('phaseSelect').value=state.phase;document.getElementById('phasehelp').textContent=phaseCopy[state.phase];app.innerHTML=pageHtml()}
function pick(q,i){state.answers[q]=i;render()}function nextQ(){if(state.q<5&&state.answers[state.q]!==null){state.q++;render()}}function prevQ(){if(state.q>0){state.q--;render()}}function finishSignal(){if(state.answers[5]!==null){state.q=6;render()}}function field(k,v){state.form[k]=v}function connectWallet(){state.walletConnected=true;render()}function disconnectWallet(){state.walletConnected=false;render()}function decision(i,v){state.applicants[i].decision=v;render()}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function copyCaption(){try{await navigator.clipboard.writeText(shareCaption());state.copyStatus='Copied';render();setTimeout(()=>{state.copyStatus='Copy caption';render()},1200)}catch{state.copyStatus='Copy failed';render()}}
async function imageBlob(){const r=await fetch(SHARE_IMG,{mode:'cors'});if(!r.ok)throw new Error('image fetch failed');return await r.blob()}
async function copyImage(){try{const b=await imageBlob();await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);alert('Share image copied. Paste it into the X composer.')}catch{window.open(SHARE_IMG,'_blank','noopener');alert('Browser could not copy the image automatically. The image was opened in a new tab.') }}
async function shareX(){const text=shareCaption();try{const b=await imageBlob();const f=new File([b],'candlekin-genesis.png',{type:b.type||'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){await navigator.share({text,files:[f],title:'Candlekin // Genesis'});return}}catch(e){}try{const b=await imageBlob();if(navigator.clipboard&&window.ClipboardItem)await navigator.clipboard.write([new ClipboardItem({'image/png':b})])}catch(e){}window.open(`https://x.com/intent/post?text=${encodeURIComponent(text)}`,'_blank','noopener,noreferrer')}
function submitApplication(){const walletOk=/^0x[a-fA-F0-9]{40}$/.test(state.form.wallet.trim());if(!state.form.x.trim()||!walletOk||!state.form.sharedUrl.trim()||state.form.response.trim().length<10){alert('Fill X username, a valid EVM wallet, shared X post URL, and a meaningful response.');return}state.submitted=true;render()}
function checkWallet(){const el=document.getElementById('checkerInput'),out=document.getElementById('checkerResult');if(!el||!out)return;const v=el.value.trim().toLowerCase();if(!/^0x[a-f0-9]{40}$/.test(v)){out.innerHTML='<div class="checker-result"><div class="tier none">Invalid.</div><div class="tier-copy">Enter a valid EVM wallet address.</div></div>';return}const r=checkerDB[v];if(r==='GTD')out.innerHTML='<div class="checker-result"><div class="tier gtd">GTD.</div><div class="tier-copy">Guaranteed presale allocation. Mint during the GTD OpenSea stage under the final stage rules.</div><div class="mini-list"><div class="mini-row"><span>Presale</span><strong>GTD</strong></div><div class="mini-row"><span>Guarantee</span><strong>YES</strong></div><div class="mini-row"><span>Current price direction</span><strong>FREE + GAS</strong></div></div></div>';else if(r==='FCFS')out.innerHTML='<div class="checker-result"><div class="tier fcfs">FCFS.</div><div class="tier-copy">You are on the FCFS presale list. You can mint during the FCFS OpenSea stage while supply remains; allocation is not guaranteed.</div><div class="mini-list"><div class="mini-row"><span>Presale</span><strong>FCFS</strong></div><div class="mini-row"><span>Guarantee</span><strong>NO</strong></div><div class="mini-row"><span>Price / limit</span><strong>TBD</strong></div></div></div>';else out.innerHTML='<div class="checker-result"><div class="tier none">Public only.</div><div class="tier-copy">This wallet is not selected for GTD or FCFS presale in the preview dataset. Public is still open to everyone later if supply remains.</div><div class="mini-list"><div class="mini-row"><span>Presale</span><strong>NOT SELECTED</strong></div><div class="mini-row"><span>Public eligibility</span><strong>YES — OPEN STAGE</strong></div></div></div>'}
phaseSelect.addEventListener('change',e=>{state.phase=e.target.value;state.page=availablePages()[0];render();scrollTo({top:0})});phasehead.addEventListener('click',()=>phasebody.classList.toggle('hidden'));
render();
Object.assign(window,{setPage,pick,nextQ,prevQ,finishSignal,field,connectWallet,disconnectWallet,decision,copyCaption,copyImage,shareX,submitApplication,checkWallet});
</script>
</body>
</html>
